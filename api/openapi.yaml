  /movies/{movie_id}:
    get:
      operationId: getMovie
      tags: [Movies]
      summary: Карточка фильма
      description: |
        Данные для блоков 1, 3, 5, 8, 9, 10 страницы фильма (#17193). По `movie_id` из выдачи поиска
        frontend открывает карточку (#17241).

        **Доступ.** Карточка открыта гостю, поэтому `security: []`: гость видит страницу, окно
        входа открывается только на действие - оценку, списки, отзыв (#17193 блоки 5, 6, 7, 12).
        Средняя оценка и число оценок видны гостю. Собственная оценка доступна через
        `GET /users/me/movies/{movie_id}`.

        **Источник.** Backend берет фильм из PostgreSQL (кеш TMDB, #17393 п. 2). Фильма там нет -
        запрашивает TMDB по `movie_id`, сохраняет в `movies` и отдает карточку (#17241). TMDB
        такого id не знает - 404. TMDB недоступен - 503, если фильма нет в кеше (#17296).

        **Язык.** Названия, жанры, страны и описание - на русском: каталог собирается с
        `language=ru-RU` (#17640), в `movies` одна локаль (#17627).

        | Ситуация | HTTP | code |
        |---|---|---|
        | фильм есть в PostgreSQL или получен из TMDB | 200 | - |
        | `movie_id` не целое положительное число или TMDB его не знает | 404 | `MOVIE_NOT_FOUND` |
        | фильма нет в кеше, TMDB недоступен | 503 | `MOVIE_UNAVAILABLE` |

        Пример запроса:

        ```
        curl https://<host>/api/v1/movies/157336
        ```
      security: []
      parameters:
        - name: movie_id
          in: path
          required: true
          description: Идентификатор фильма TMDB (#17241).
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 157336
      responses:
        '200':
          description: Карточка фильма.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieCard'
              examples:
                full:
                  summary: Все поля заполнены
                  value:
                    movie_id: 157336
                    title: Интерстеллар
                    original_title: Interstellar
                    year: 2014
                    age_rating: 12+
                    poster_url: https://image.tmdb.org/t/p/w500/poster-157336.jpg
                    runtime_min: 169
                    overview: Группа исследователей отправляется через червоточину искать планету для человечества.
                    genres:
                      - id: 12
                        name: приключения
                      - id: 18
                        name: драма
                      - id: 878
                        name: фантастика
                    countries:
                      - code: US
                        name: США
                      - code: GB
                        name: Великобритания
                    crew:
                      - person_id: 525
                        name: Кристофер Нолан
                        role: director
                      - person_id: 525
                        name: Кристофер Нолан
                        role: writer
                      - person_id: 527
                        name: Джонатан Нолан
                        role: writer
                      - person_id: 947
                        name: Ханс Циммер
                        role: composer
                      - person_id: 556
                        name: Эмма Томас
                        role: producer
                    actors:
                      - person_id: 10297
                        name: Мэттью Макконахи
                        character: Купер
                        photo_url: https://image.tmdb.org/t/p/w185/profile-10297.jpg
                      - person_id: 3895
                        name: Майкл Кейн
                        character: профессор Брэнд
                        photo_url: https://image.tmdb.org/t/p/w185/profile-3895.jpg
                    average_rating: 8.6
                    ratings_count: 5
                empty:
                  summary: Пустые состояния - нет постера, рейтинга, длительности, описания, съемочной группы, актеров
                  value:
                    movie_id: 1000001
                    title: Фильм без данных
                    original_title: Film Without Data
                    year: null
                    age_rating: null
                    poster_url: null
                    runtime_min: null
                    overview: null
                    genres: []
                    countries: []
                    crew: []
                    actors: []
                    average_rating: null
                    ratings_count: 0
        '404':
          description: >-
            Фильма с таким `movie_id` нет ни в PostgreSQL, ни в TMDB, или `movie_id` не целое
            положительное число. Frontend показывает сообщение вместо карточки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                MOVIE_NOT_FOUND:
                  value:
                    code: MOVIE_NOT_FOUND
                    message: Фильм не найден
                    field: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: >-
            Фильма нет в кеше, TMDB недоступен: вызовы к TMDB приостановлены или он не ответил
            (#17296, действия по смягчению п. 3). Фильм из кеша отдается и при недоступном TMDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                MOVIE_UNAVAILABLE:
                  value:
                    code: MOVIE_UNAVAILABLE
                    message: Не удалось загрузить информацию о фильме. Попробуйте позже
                    field: null
  /movies/{movie_id}/rating:
    parameters:
      - name: movie_id
        in: path
        required: true
        description: Идентификатор фильма TMDB (#17241).
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 157336
    put:
      operationId: setMovieRating
      tags: [Ratings]
      summary: Поставить или изменить свою оценку
      description: |
        Сохраняет одну оценку фильма от текущего пользователя (#17028 п. 1–2). Новый балл
        заменяет прежний. Повтор с тем же баллом сохраняет оценку и дату её создания.
        Фильм должен быть в `movies`. Открытие карточки добавляет его туда при необходимости.
        После успешной записи клиент перечитывает карточку и состояние фильма у пользователя.
        Сначала проверяется сессия, затем формат `movie_id`, тело и наличие фильма в `movies`.
        Дополнительные поля тела игнорируются. Дробная часть балла должна быть нулевой.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 9
      responses:
        '204':
          description: Оценка сохранена.
        '400':
          description: Некорректное тело или балл вне целого диапазона 1–10.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_PARAMETER
                message: Оценка должна быть целым числом от 1 до 10
                field: score
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Фильма нет в `movies` или некорректен идентификатор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MOVIE_NOT_FOUND
                message: Фильм не найден
                field: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: removeMovieRating
      tags: [Ratings]
      summary: Удалить свою оценку
      description: |
        Удаляет оценку текущего пользователя (#17028 п. 3). Для существующего фильма без своей
        оценки также возвращается 204. После удаления клиент перечитывает карточку и состояние
        фильма у пользователя.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: У текущего пользователя нет оценки этого фильма.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Фильма нет в `movies` или некорректен идентификатор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MOVIE_NOT_FOUND
                message: Фильм не найден
                field: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /movies/{movie_id}/reviews:
    get:
      operationId: listMovieReviews
      tags: [Reviews]
      summary: Отзывы о фильме
      description: |
        Блок «Отзывы» на странице фильма (#17239, блок 13 #17193): по 10 отзывов, кнопка «Еще
        отзывы» - следующая страница с той же сортировкой.

        **Доступ.** Список открыт гостю. Недействительная cookie обрабатывается как гостевой запрос.
        Если в запросе действующая сессия,
        собственный отзыв исключён из `reviews` на всех страницах. На первой странице он
        возвращается в поле `own_review`, если существует, и отображается первым (#17029 п. 3).
        Ответ зависит от cookie сессии и содержит `Cache-Control: no-store`.

        **Сортировка** (#17239), при равенстве - от новых отзывов к старым:

        | `sort` | Порядок |
        |---|---|
        | `best`, по умолчанию | больше реакций «палец вверх» |
        | `worst` | больше реакций «палец вниз» |
        | `newest` | по дате создания, сначала новые |
        | `oldest` | по дате создания, сначала старые |

        Допущения: в #17239 для «Сначала худшие» правило равенства говорит о положительных
        реакциях - читаем «негативных». «Отображаются только отзывы в порядке убывания реакций» -
        порядок, а не фильтр: отзыв без реакций тоже в списке.

        **Страницы.** `page` с 1, в `reviews` до 10 отзывов. `has_more` относится только к `reviews`.
        `own_review` на первой странице возвращается сверх лимита массива.
        Реакции между запросами могут поменяться, и на стыке страниц отзыв повторится или
        пропадет: при числе отзывов на фильм это допустимо (допущение).

        | Ситуация | HTTP | code |
        |---|---|---|
        | отзывы есть или их нет, в том числе фильма нет в `movies` | 200 | - |
        | `movie_id` не целое положительное число | 404 | `MOVIE_NOT_FOUND` |
        | `sort` не из списка или `page` не целое число от 1 | 400 | `INVALID_PARAMETER` |

        Пример запроса:

        ```
        curl 'https://<host>/api/v1/movies/157336/reviews?sort=newest&page=2'
        curl --cookie 'dv_session=<token>' 'https://<host>/api/v1/movies/157336/reviews'
        ```
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: movie_id
          in: path
          required: true
          description: Идентификатор фильма TMDB (#17241).
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 157336
        - name: sort
          in: query
          required: false
          description: Порядок отзывов, см. описание операции.
          schema:
            type: string
            enum: [best, worst, newest, oldest]
            default: best
        - name: page
          in: query
          required: false
          description: Номер страницы массива reviews, с 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
            default: 1
      responses:
        '200':
          description: Страница отзывов.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieReviewsPage'
              examples:
                page:
                  summary: Первая страница, дальше есть еще
                  value:
                    reviews:
                      - review_id: 42
                        username: movie_fan_42
                        created_at: '2026-11-12T08:37:00Z'
                        is_edited: false
                        verdict: positive
                        title: Космос, время и отцовство
                        body: >-
                          Нолан снова играет со временем, но на этот раз
                          за формулами стоит простая история отца и
                          дочери. Сцены на планете Миллер держат в
                          напряжении, а возвращение домой к повзрослевшей
                          Мерф - самый сильный момент фильма. Музыка
                          Циммера с органом работает как отдельный
                          персонаж. Минус - затянутая середина и
                          объяснения, которые героям проговаривают слишком
                          подробно. Смотреть обязательно на большом
                          экране.
                        likes: 12
                        dislikes: 3
                      - review_id: 17
                        username: null
                        created_at: '2026-11-03T19:05:00Z'
                        is_edited: true
                        verdict: neutral
                        title: null
                        body: >-
                          Красивый фильм, но мне не хватило героев: о
                          людях здесь говорят меньше, чем о гравитации.
                          Первая половина про ферму и пыльные бури
                          получилась живой и тревожной, дальше сюжет
                          превращается в лекцию по физике с очень
                          красивыми картинками. Финал в тессеракте одних
                          приведет в восторг, других заставит закатить
                          глаза. Однажды посмотреть стоит, пересматривать
                          не тянет.
                        likes: 0
                        dislikes: 0
                    has_more: true
                empty:
                  summary: Отзывов нет
                  value:
                    reviews: []
                    has_more: false
        '400':
          description: '`sort` или `page` вне допустимых значений.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_PARAMETER
                message: Некорректный запрос
                field: sort
        '404':
          description: '`movie_id` не целое положительное число.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MOVIE_NOT_FOUND
                message: Фильм не найден
                field: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createMovieReview
      tags: [Reviews]
      summary: Опубликовать отзыв о фильме
      description: |
        Один отзыв на фильм от пользователя (#17029). Вердикт обязателен. Длины измеряются
        в кодовых точках Unicode. U+0000 не поддерживается хранилищем.
        У нового отзыва нет реакций, `is_edited` равно false.
        Тело запроса принимается с типом `application/json`.
        Требуется cookie `dv_session`. Отсутствующая сессия даёт `SESSION_REQUIRED`,
        недействительная или истёкшая — `SESSION_EXPIRED`.
        Сессия, идентификатор и тело проверяются в этом порядке до поиска фильма и дубликата.
      security:
        - sessionCookie: []
      parameters:
        - name: movie_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Отзыв опубликован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieReview'
        '400':
          description: Некорректное тело запроса, код `VALIDATION_ERROR`. Поле `field` указывает на ошибочное поле, если оно известно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Фильм не найден в каталоге либо идентификатор некорректен, код `MOVIE_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: У пользователя уже есть отзыв о фильме, код `REVIEW_ALREADY_EXISTS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /reviews/{review_id}:
    parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      operationId: updateMyReview
      tags: [Reviews]
      summary: Редактировать свой отзыв
      description: |
        Передайте хотя бы одно поле. Меняются только переданные поля.
        Тело запроса принимается с типом `application/json`.
        Отправьте `title` со значением null или пустой строкой,
        чтобы удалить заголовок. Длины измеряются в кодовых точках Unicode.
        U+0000 не поддерживается хранилищем. Дата публикации сохраняется, `is_edited` становится true.
        Редактирование доступно только автору с действующей сессией.
        Сессия, идентификатор и тело проверяются в этом порядке до поиска отзыва и проверки автора.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
            example:
              title: null
      responses:
        '200':
          description: Отзыв сохранён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieReview'
        '400':
          description: Некорректное тело запроса, код `VALIDATION_ERROR`. Поле `field` указывает на ошибочное поле, если оно известно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Отзыв принадлежит другому пользователю или автор удалён, код `REVIEW_NOT_OWNER`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Отзыв не найден либо идентификатор некорректен, код `REVIEW_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMyReview
      tags: [Reviews]
      summary: Удалить свой отзыв
      description: Только для автора с действующей сессией. После удаления можно опубликовать новый отзыв о фильме.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Отзыв удалён.
        '403':
          description: Отзыв принадлежит другому пользователю или автор удалён, код `REVIEW_NOT_OWNER`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Отзыв не найден либо идентификатор некорректен, код `REVIEW_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me/reviews:
    get:
      operationId: listMyReviews
      tags: [Reviews]
      summary: Мои отзывы
      description: |
        Отзывы владельца сессии с плитками соответствующих фильмов (#17030 п. 2.3.6, 2.4).
        Общее число отзывов без фильтра также доступно в `stats.reviews_count` ответа `GET /users/me`.
        Сортировки `newest` и `oldest` используют дату публикации, `title_asc` и
        `title_desc` — название фильма, `best` и `worst` — среднюю оценку фильма.
        При сортировке по оценке фильмы без оценок идут последними. При равных названии или
        оценке первыми идут свежие отзывы. При равной дате порядок определяется по ID отзыва
        (по возрастанию для `oldest`, по убыванию для остальных).
        Страница за последней содержит пустой массив и общее число совпадений.
      security:
        - sessionCookie: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, title_asc, title_desc, best, worst]
            default: newest
        - name: q
          in: query
          description: Часть русского названия без учёта регистра. Требуется UTF-8 без U+0000. Пробелы по краям отбрасываются.
          schema:
            type: string
          example: матр
        - name: page
          in: query
          description: Номер страницы по 24 отзыва, с 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
            default: 1
      responses:
        '200':
          description: Страница отзывов пользователя.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyReviewsPage'
        '400':
          description: Некорректный `sort`, `q` или `page`, код `INVALID_PARAMETER`. Поле `field` содержит имя параметра.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me/ratings:
    get:
      operationId: listUserRatings
      tags: [Ratings]
      summary: Мои оценки
      description: |
        Фильмы, которые оценил текущий пользователь (#17030 п. 2.3.4, 2.4).
        Формат плиток, поиск по названию и страницы по 24 фильма совпадают со списками профиля.
        Сортировки `newest` и `oldest` используют дату первой записи текущей оценки. Сортировки
        `best` и `worst` используют среднюю оценку фильма. При равенстве сначала идут недавние оценки.
        Страница за последней возвращает пустой `movies` и число всех совпадений в `total`.
      security:
        - sessionCookie: []
      parameters:
        - name: sort
          in: query
          description: Порядок фильмов, по умолчанию сначала недавно оценённые.
          schema:
            type: string
            enum: [newest, oldest, title_asc, title_desc, best, worst]
            default: newest
        - name: q
          in: query
          description: Часть русского названия без учёта регистра. Пробелы по краям отбрасываются.
          schema:
            type: string
          example: матр
        - name: page
          in: query
          description: Номер страницы по 24 фильма, с 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
            default: 1
      responses:
        '200':
          description: Страница оценённых фильмов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListPage'
        '400':
          description: Некорректный `sort` или `page`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_PARAMETER
                message: Некорректный запрос
                field: sort
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me/lists/{list_type}:
    get:
      operationId: listUserMovies
      tags: [Lists]
      summary: Фильмы списка
      description: |
        Список «Хочу посмотреть» или «Просмотрено» в профиле (#17030 п. 2.2, 2.4): по 24 фильма
        на странице, сортировка и поиск по названию. На другой странице frontend передает те же
        `sort` и `q` (#17030 п. 2.4.4.1).

        **Сортировка** (#17030 п. 2.4.6), при равенстве - от недавно добавленных к ранним:

        | `sort` | Порядок |
        |---|---|
        | `newest`, по умолчанию | по дате добавления в список, сначала новые |
        | `oldest` | по дате добавления, сначала старые |
        | `title_asc` | по названию, А-Я |
        | `title_desc` | по названию, Я-А |
        | `best` | по `average_rating`, сначала лучшие |
        | `worst` | по `average_rating`, сначала худшие |

        Название сравнивается по правилам русского языка (`title` в `movies` - ICU `ru-RU`). Фильмы
        без оценок в `best` и `worst` идут после оцененных (допущение).

        **Поиск** (#17030 п. 2.4.7): `q` - часть названия на русском (`title`, как на плитке), без
        учета регистра. Пробелы по краям `q` не учитываются, пустой `q` - весь список («Очистить»,
        п. 2.4.7.4).

        **Страницы.** `page` с 1, на странице до 24 фильмов (#17030 п. 2.4.2). Число страниц
        frontend считает из `total`. Страница за последней - пустой `movies`.

        | Ситуация | HTTP | code |
        |---|---|---|
        | фильмы есть или список пуст | 200 | - |
        | `list_type` или `sort` не из списка, `page` не целое число от 1 до 2147483647 | 400 | `INVALID_PARAMETER` |
        | нет сессии или она истекла | 401 | `SESSION_REQUIRED`, `SESSION_EXPIRED` |

        Пример запроса:

        ```
        curl -b 'dv_session=<id>' -G 'https://<host>/api/v1/users/me/lists/watched' \
          -d sort=title_asc --data-urlencode 'q=матр' -d page=2
        ```
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ListTypePath'
        - name: sort
          in: query
          required: false
          description: Порядок фильмов, см. описание операции.
          schema:
            type: string
            enum: [newest, oldest, title_asc, title_desc, best, worst]
            default: newest
        - name: q
          in: query
          required: false
          description: Часть названия фильма, см. описание операции.
          schema:
            type: string
          example: матр
        - name: page
          in: query
          required: false
          description: Номер страницы по 24 фильма, с 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
            default: 1
      responses:
        '200':
          description: Страница списка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListPage'
              examples:
                page:
                  summary: Первая страница из двух, фильм без оценок
                  value:
                    movies:
                      - movie_id: 157336
                        title: Интерстеллар
                        poster_url: https://image.tmdb.org/t/p/w500/poster-157336.jpg
                        average_rating: 8.6
                        user_rating: 9
                      - movie_id: 20992
                        title: Фильм без данных
                        poster_url: null
                        average_rating: null
                        user_rating: null
                    total: 30
                empty:
                  summary: Список пуст или по `q` ничего не нашлось
                  value:
                    movies: []
                    total: 0
        '400':
          description: '`list_type`, `sort` или `page` вне допустимых значений.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_PARAMETER
                message: Некорректный запрос
                field: sort
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me/lists/{list_type}/{movie_id}:
    parameters:
      - $ref: '#/components/parameters/ListTypePath'
      - name: movie_id
        in: path
        required: true
        description: Идентификатор фильма TMDB (#17241).
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 157336
    put:
      operationId: addMovieToList
      tags: [Lists]
      summary: Добавить фильм в список
      description: |
        Нажатие на чекбокс «Хочу посмотреть» или «Просмотрено» на странице фильма (#17026 п. 1,
        #17027 п. 1, блоки 6, 7 #17193). Фильм попадает в список с текущей датой добавления.

        Повторное добавление ничего не меняет: дубля нет, дата добавления прежняя, ответ тот же.
        Поэтому `PUT`: запрос можно безопасно повторить, например после входа (#17026 п. 3).

        Списки независимы, фильм может быть в обоих (`contracts/db-schema.md`). Оценку фильма
        отметка не меняет (#17027 п. 1). Добавление пишется в историю действий (`user_actions`)
        в той же транзакции, повторное - не пишется.

        Фильм должен быть в `movies`. Страница фильма загружает карточку `GET /movies/{movie_id}`,
        а она сохраняет фильм из TMDB в `movies` (#17241), поэтому со страницы фильма 404 не бывает.

        | Ситуация | HTTP | code |
        |---|---|---|
        | фильм добавлен или уже был в списке | 204 | - |
        | `list_type` не из списка | 400 | `INVALID_PARAMETER` |
        | нет сессии или она истекла | 401 | `SESSION_REQUIRED`, `SESSION_EXPIRED` |
        | `movie_id` не целое положительное число или фильма нет в `movies` | 404 | `MOVIE_NOT_FOUND` |

        Пример запроса:

        ```
        curl -X PUT -b 'dv_session=<id>' https://<host>/api/v1/users/me/lists/want_to_watch/157336
        ```
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Фильм в списке.
        '400':
          description: '`list_type` не из списка.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_PARAMETER
                message: Некорректный запрос
                field: list_type
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`movie_id` не целое положительное число или фильма нет в `movies`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MOVIE_NOT_FOUND
                message: Фильм не найден
                field: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: removeMovieFromList
      tags: [Lists]
      summary: Убрать фильм из списка
      description: |
        Повторное нажатие на чекбокс на странице фильма или кнопка «Удалить» у фильма в профиле
        (#17026 п. 2, #17027 п. 2). Подтверждения нет.

        Фильма в списке нет - тоже 204: результат тот же, запрос можно безопасно повторить.
        Удаление пишется в историю действий (`user_actions`) в той же транзакции, удаление
        отсутствующего - не пишется.

        | Ситуация | HTTP | code |
        |---|---|---|
        | фильм удален из списка или его там не было | 204 | - |
        | `list_type` не из списка | 400 | `INVALID_PARAMETER` |
        | нет сессии или она истекла | 401 | `SESSION_REQUIRED`, `SESSION_EXPIRED` |
        | `movie_id` не целое положительное число | 404 | `MOVIE_NOT_FOUND` |

        Пример запроса:

        ```
        curl -X DELETE -b 'dv_session=<id>' https://<host>/api/v1/users/me/lists/want_to_watch/157336
        ```
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Фильма в списке нет.
        '400':
          description: '`list_type` не из списка.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_PARAMETER
                message: Некорректный запрос
                field: list_type
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`movie_id` не целое положительное число.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MOVIE_NOT_FOUND
                message: Фильм не найден
                field: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me/movies/{movie_id}:
    get:
      operationId: getUserMovieState
      tags: [Lists]
      summary: Оценка и списки пользователя для фильма
      description: |
        Состояние чекбоксов «Хочу посмотреть» и «Просмотрено» на странице фильма (блоки 6, 7
        #17193) и собственная оценка пользователя (блок 5). Frontend запрашивает эти данные
        вместе с карточкой, если пользователь вошел.

        Гость операцию не вызывает: у него чекбоксы не установлены, окно входа открывается только
        по нажатию (#17026 п. 3, #17027 п. 3). Поэтому на 401 этой операции frontend окно входа не
        открывает, а показывает чекбоксы гостя.

        Отдельная операция, а не поля `MovieCard`: карточка открыта гостю и одинакова для всех, а
        это данные пользователя.

        | Ситуация | HTTP | code |
        |---|---|---|
        | фильм в списках или нет, в том числе фильма нет в `movies` | 200 | - |
        | нет сессии или она истекла | 401 | `SESSION_REQUIRED`, `SESSION_EXPIRED` |
        | `movie_id` не целое положительное число | 404 | `MOVIE_NOT_FOUND` |

        Пример запроса:

        ```
        curl -b 'dv_session=<id>' https://<host>/api/v1/users/me/movies/157336
        ```
      security:
        - sessionCookie: []
      parameters:
        - name: movie_id
          in: path
          required: true
          description: Идентификатор фильма TMDB (#17241).
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 157336
      responses:
        '200':
          description: Состояние списков и собственная оценка пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMovieState'
              example:
                want_to_watch: true
                watched: false
                user_rating: 9
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`movie_id` не целое положительное число.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MOVIE_NOT_FOUND
                message: Фильм не найден
                field: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
tags:
  - name: search
    description: Поиск фильма по изображению, видео, тексту (#17628) и аудио (#17643).
  - name: Auth
    description: |
      Регистрация, подтверждение email, вход, выход, сессия (#17148, #17149, #17151). Sprint 1.

      ### Сессия

      - Серверная: запись в PostgreSQL, в cookie `dv_session` только случайный идентификатор
        (#17094 п. 1.3, wiki «Стек технологий», разд. 5). JWT нет.
      - Cookie: `HttpOnly; Secure; SameSite=Lax; Path=/api/v1; Max-Age=86400`. JavaScript ее не
        читает, состояние входа клиент узнает через `GET /auth/session`.
      - Срок - 24 ч с момента создания, без продления: #17094 п. 1.3 ограничивает сессию 24
        часами, скользящее продление этот предел снимает. После истечения нужен новый вход.
      - Сессия создается при входе, подтверждении email, завершении входа через OIDC и сбросе
        пароля. Идентификатор каждый раз новый, сессия из cookie запроса, если была, удаляется.
      - Сессия завершается: выход (#17151, только текущая), истечение срока, сброс пароля
        (#17150 п. 2.5, все сессии), смена пароля из профиля (#17150 п. 3.3, все, кроме текущей).
      - `SameSite=Lax`: браузер не отправляет cookie в POST с чужого сайта. CORS - только домен
        приложения (#17094 п. 4.4).

      ### Без авторизации и с истекшей сессией

      Операции с `security: [{sessionCookie: []}]` доступны только авторизованному пользователю
      (#17094 п. 1.1, 1.4). Операции с `security: []` открыты гостю.

      | Запрос к операции с `sessionCookie` | Ответ |
      |---|---|
      | нет cookie `dv_session` | 401 `SESSION_REQUIRED` |
      | сессия истекла, завершена или не найдена | 401 `SESSION_EXPIRED` и `Set-Cookie` с `Max-Age=0` |

      Операция гостя с недействительной cookie выполняется как для гостя, cookie стирается.

      Что делает клиент по 401:
      - на действие пользователя (добавить в список, оценить и т.п.) - переходит в состояние
        гостя, открывает окно входа, после входа повторяет действие (#17149 п. 2.6, #17026 п. 3,
        #17027 п. 3);
      - на `GET /auth/session` при загрузке SPA и на `POST /auth/logout` - просто показывает
        гостя, окно входа не открывает.

      Поэтому 401 означает только отсутствие сессии, неверный пароль при входе - 400.

      ### Контроль прав

      Роли две: «Гость» и «Пользователь» (#17148 п. 2.6, #17151 п. 2). Гостю доступны
      операции с `security: []`, пользователю - все. Свои ресурсы пользователь адресует через
      `/users/me`: владелец берется из сессии, а не из пути или тела. Операций над чужими
      учетными записями в API нет. Проверка прав (#17094 п. 4.1) - проверка сессии на каждом
      запросе к операции с `sessionCookie` и выборка данных только владельца сессии. Профиль
      другим пользователям недоступен (#17030 п. 1).

      ### Ошибки

      Тело ошибки - `Error`. `message` клиент показывает как есть: текст на русском
      (#17097 п. 1.2) из требований, без внутренних деталей (#17094 п. 4.3). Стек, SQL, пути,
      ответы OIDC-провайдеров и SmartCaptcha наружу не уходят, непредвиденная ошибка -
      `500 INTERNAL_ERROR`. Сервер возвращает одну ошибку, первую найденную: она показывается
      над формой (#17148 п. 2.2 шаг 8, #17149 п. 2.2 шаг 10), `field` - для подсветки поля.

      Сервер повторяет клиентские проверки (#17148 п. 2.3, #17149 п. 2.3): клиент можно обойти.
      Правила и тексты по полям - в схемах `AuthUsername`, `AuthEmail`, `AuthBirthYear`,
      `AuthPassword`, `AuthLogin`. Тело не JSON - `400 AUTH_VALIDATION_ERROR`, `field: null`,
      «Произошла ошибка. Попробуйте позже».

      HTTP-коды: 400 - исправить ввод, 401 - нет сессии, 403 - состояние учетной записи не
      позволяет, 409 - занято, 410 - ссылка или ожидание истекли, 429 - лимит.

      | code | HTTP | Текст | Откуда |
      |---|---|---|---|
      | `AUTH_VALIDATION_ERROR` | 400 | по полю, см. схемы | #17148 п. 2.3, #17149 п. 2.3, #17150 п. 1.2, 2.3, 3.2 |
      | `AUTH_BIRTH_YEAR_INVALID` | 400 | «Введите корректный год рождения» | #17148 п. 2.4 |
      | `AUTH_INVALID_CREDENTIALS` | 400 | «Неверные имя пользователя или пароль» / «Неверные email или пароль» | #17149 п. 2.4 |
      | `AUTH_PASSWORD_SAME_AS_CURRENT` | 400 | «Новый пароль должен отличаться от текущего» | #17150 п. 2.4, 3.2 |
      | `AUTH_CURRENT_PASSWORD_INVALID` | 400 | «Неверный текущий пароль» | #17150 п. 3.2 |
      | `SESSION_REQUIRED` | 401 | «Войдите, чтобы продолжить» | допущение |
      | `SESSION_EXPIRED` | 401 | «Сессия истекла. Войдите снова» | допущение |
      | `AUTH_EMAIL_NOT_CONFIRMED` | 403 | «Email не подтверждён. Проверьте почту или запросите новую ссылку» | #17148 п. 2.5, #17149 п. 2.4 |
      | `AUTH_ACCOUNT_BLOCKED` | 403 | «Ваша учётная запись заблокирована. Обратитесь в службу поддержки» | #17149 п. 2.4 |
      | `AUTH_CAPTCHA_REQUIRED` | 403 | «Подтвердите, что вы не робот» | допущение |
      | `AUTH_CAPTCHA_INVALID` | 403 | «Проверка не пройдена. Попробуйте ещё раз» | допущение |
      | `AUTH_EMAIL_TAKEN` | 409 | «Пользователь с таким email уже существует» | #17148 п. 2.4 |
      | `AUTH_USERNAME_TAKEN` | 409 | «Это имя пользователя уже занято» | #17148 п. 2.4 |
      | `AUTH_CONFIRMATION_LINK_EXPIRED` | 410 | «Срок действия ссылки истёк» | #17148 п. 2.5 |
      | `AUTH_OIDC_EXPIRED` | 410 | «Не удалось выполнить вход через {провайдер}. Попробуйте снова или используйте другой способ» | текст #17148 п. 3.4, случай - допущение |
      | `AUTH_RESET_LINK_EXPIRED` | 410 | «Срок действия ссылки истёк. Запросите восстановление пароля повторно» | #17150 п. 2.4 |
      | `AUTH_LOGIN_LOCKED` | 429 | «Слишком много попыток входа. Повторите через {N} минут» | #17149 п. 2.4 |
      | `RATE_LIMITED` | 429 | «Слишком много запросов. Попробуйте позже» | #17094 п. 3.4, текст - допущение |
      | `INTERNAL_ERROR` | 500 | «Произошла ошибка. Попробуйте позже» | #17148 п. 2.4, #17149 п. 2.4 |
  - name: OIDC
    description: |
      Вход и регистрация через Google, Яндекс, VK ID (#17148 п. 3, #17149 п. 3). OAuth2
      authorization code flow со `state` и PKCE (S256), обмен кода и запрос профиля делает
      backend (wiki «Стек технологий», разд. 10).

      1. Кнопка провайдера - переход браузера на `GET /auth/oidc/{provider}/start`. Куда вернуть
         пользователя после входа, SPA запоминает сама до перехода (#17149 п. 2.6).
      2. Backend ставит cookie `dv_oidc` и отправляет браузер к провайдеру.
      3. Провайдер возвращает браузер на `GET /auth/oidc/{provider}/callback`. Backend ищет
         учетную запись сначала по привязке к аккаунту провайдера (#17149 п. 3.1), затем по
         email (#17148 п. 3.2), и отправляет браузер на страницу SPA `/auth/oidc` с параметрами
         `provider` и `result`.

      | `result` | Когда | Что делает SPA |
      |---|---|---|
      | `success` | учетная запись привязана к провайдеру и активна | сессия уже создана, возврат на исходную страницу (#17149 п. 3.2) |
      | `registration_required` | нет ни привязки, ни учетной записи с этим email | «Завершение регистрации»: `GET /auth/oidc/pending`, затем `POST /auth/oidc/complete` (#17148 п. 3.2 шаги 8-10) |
      | `link_required` | учетная запись с этим email есть, провайдер не привязан | форма входа с сообщением «Учётная запись с email {email} уже существует. Войдите с паролем, чтобы привязать {провайдер}», email - из `GET /auth/oidc/pending`; после `POST /auth/login` провайдер привязан (#17148 п. 3.2 шаг 7) |
      | `account_blocked` | учетная запись заблокирована | «Ваша учётная запись заблокирована. Обратитесь в службу поддержки» (#17149 п. 3.1) |
      | `error` | отказ пользователя, ошибка или недоступность провайдера, неверный `state` | исходная форма с сообщением «Не удалось выполнить вход через {провайдер}. Попробуйте снова или используйте другой способ» (#17148 п. 3.4, #17149 п. 3.3) |

      Учетная запись создается при завершении регистрации, а не при возврате от провайдера:
      без года рождения регистрация не закончена (#17148 п. 2.6, 3.3). До этого данные
      провайдера лежат в серверной записи, к браузеру ее привязывает cookie `dv_oidc`
      (таблица `oidc_pending`, #17627). Решение архитектора 27.09: в #17148 п. 3.2 шаг 7
      учетная запись создается сразу, для пользователя разницы нет.

      Cookie `dv_oidc`: `HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth`, 30 минут
      (допущение). `SameSite=Lax` нужен, чтобы cookie пришла на callback при переходе с сайта
      провайдера. В cookie только идентификатор записи со `state`, `code_verifier` и данными
      профиля провайдера.

      Маршруты SPA `/auth/oidc` и `/confirm-email` - предложение, согласуются с frontend в #17634.
