openapi: 3.0.3
info:
  title: DejaView API
  version: 0.0.1
  description: Черновик контракта API. Заполняется командой backend.
servers:
  - url: /api/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dv_session
      description: >-
        Идентификатор серверной сессии. Сессия хранится в PostgreSQL, срок жизни
        не более 24 ч (#17094 п. 1.3).
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки в UPPER_SNAKE_CASE.
          example: FILE_TOO_LARGE
        message:
          type: string
          description: >-
            Текст для пользователя на русском (#17097 п. 1.2), без внутренних деталей
            системы (#17094 п. 4.3).
        field:
          type: string
          nullable: true
          description: Поле формы или параметр запроса, к которому относится ошибка.
    SearchErrorCode:
      type: string
      description: |
        Коды ошибок поиска. Какой подпункт требований каким кодом закрыт - в описании операции.

        - `FILE_REQUIRED` - файл не передан.
        - `TOO_MANY_FILES` - передано больше одного файла.
        - `FILE_TOO_LARGE` - файл больше лимита режима.
        - `UNSUPPORTED_FORMAT` - формат файла не из списка режима.
        - `VIDEO_TOO_LONG` - видео длиннее 30 с.
        - `AUDIO_TOO_LONG` - аудио длиннее 10 с.
        - `FILE_CORRUPTED` - файл поврежден или не декодируется.
        - `QUERY_EMPTY`, `QUERY_TOO_SHORT`, `QUERY_TOO_LONG`, `QUERY_NOT_ALLOWED` - ошибки текстового запроса.
        - `SEARCH_UNAVAILABLE` - ML-сервис недоступен или не ответил в таймаут.
        - `SERVER_BUSY` - перегрузка: лимит параллельных запросов к ML-сервису исчерпан.
      enum:
        - FILE_REQUIRED
        - TOO_MANY_FILES
        - FILE_TOO_LARGE
        - UNSUPPORTED_FORMAT
        - VIDEO_TOO_LONG
        - AUDIO_TOO_LONG
        - FILE_CORRUPTED
        - QUERY_EMPTY
        - QUERY_TOO_SHORT
        - QUERY_TOO_LONG
        - QUERY_NOT_ALLOWED
        - SEARCH_UNAVAILABLE
        - SERVER_BUSY
    SearchError:
      description: Ошибка поиска - `Error` с кодом из `SearchErrorCode`.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              $ref: '#/components/schemas/SearchErrorCode'
    SearchImageRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: >-
            Один файл изображения: JPG, JPEG, PNG или WEBP, до 10 МБ (#17153 п. 4.2). Картинка,
            вставленная из буфера обмена (#17153 п. 3.2), отправляется так же, как выбранный файл.
    SearchVideoRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: >-
            Один видеофайл: MP4, MOV или WEBM, не длиннее 30 с и до 50 МБ (#17154 п. 4.2).
    SearchAudioRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: >-
            Один аудиофайл: MP3, WAV, OGG или M4A, не длиннее 10 с и до 20 МБ (#17155 п. 4.2).
            Запись с микрофона (#17155 п. 3.2) отправляется так же, как выбранный файл, в WAV.
    SearchTextRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 3
          maxLength: 250
          description: >-
            Свободное описание фильма на русском или английском (#17152 п. 3.1-3.3), от 3 до 250
            символов (#17152 п. 3.4).
          example: фильм, где хакеру предлагают выбрать красную или синюю таблетку
    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          maxItems: 10
          description: >-
            Фильмы по убыванию релевантности. Для текста не больше 10 (#17152 п. 4.4), для
            изображения и видео не больше 1 (#17153 п. 6.1, #17154 п. 6.1). Пустой массив - ничего
            не найдено (#17152 п. 6, #17153 п. 7, #17154 п. 7), это не ошибка. Score релевантности
            не отдается (#17392 п. 5, #17152 п. 5.4). Фильм, для которого нет карточки ни в
            PostgreSQL, ни в TMDB, в выдачу не попадает; если так выпали все, ответ - пустая
            выдача, а не 503.
          items:
            $ref: '#/components/schemas/MovieSearchResult'
    MovieSearchResult:
      type: object
      description: >-
        Элемент выдачи: поля по #17152 п. 5.1, #17153 п. 6.2, #17154 п. 6.2. Backend берет их из
        PostgreSQL (кеш TMDB, #17393 п. 2), отдельный запрос на каждый элемент выдачи не нужен.
      required: [movie_id, title, year, poster_url, overview]
      properties:
        movie_id:
          type: integer
          format: int64
          description: >-
            Идентификатор фильма TMDB (#17241). По нему frontend открывает карточку фильма
            (#17153 п. 6.2.5, 6.3).
          example: 603
        title:
          type: string
          description: Название фильма.
          example: Матрица
        year:
          type: integer
          nullable: true
          description: Год выпуска, null - год неизвестен.
          example: 1999
        poster_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Полный URL постера на CDN TMDB (#17393 п. 2). null - постера нет, frontend показывает
            заглушку.
          example: https://image.tmdb.org/t/p/w500/poster-603.jpg
        overview:
          type: string
          nullable: true
          description: >-
            Описание фильма целиком, null - описания нет. До фрагмента его обрезает frontend под
            свою верстку.
          example: Хакер Нео узнает, что мир вокруг - компьютерная симуляция.
    # --- #17629: регистрация, вход, сессия, пароль ---
    AuthUsername:
      type: string
      minLength: 3
      maxLength: 30
      pattern: '^[A-Za-z0-9_]+$'
      description: |
        Имя пользователя (#17148 п. 2.1, #17030 п. 2.1.2): 3-30 символов, латинские буквы, цифры
        и `_`, уникально в системе. Уникальность без учета регистра (допущение).

        Ошибки, code `AUTH_VALIDATION_ERROR`, field `username` (#17148 п. 2.3):
        - пусто - «Введите имя пользователя»;
        - короче 3 символов - «Имя пользователя должно содержать не менее 3 символов»;
        - длиннее 30 символов - «Имя пользователя должно содержать не более 30 символов»;
        - другие символы - «Имя пользователя может содержать только латинские буквы, цифры и
          нижнее подчёркивание».

        Занято - `409 AUTH_USERNAME_TAKEN` (#17148 п. 2.4).
      example: movie_fan_42
    AuthEmail:
      type: string
      format: email
      maxLength: 254
      description: |
        Email (#17148 п. 2.1): формат RFC 5322, уникален в системе. Сравнивается без учета
        регистра (допущение). Не длиннее 254 символов - предел адреса в RFC 5321 (допущение).

        Ошибки, code `AUTH_VALIDATION_ERROR`, field `email` (#17148 п. 2.3):
        - пусто - «Введите email»;
        - неверный формат или длина - «Введите корректный email».

        Занят - `409 AUTH_EMAIL_TAKEN` (#17148 п. 2.4).
      example: ivan@example.com
    AuthBirthYear:
      type: integer
      minimum: 1900
      description: |
        Год рождения, YYYY (#17148 п. 2.1). Верхняя граница - текущий год: она меняется, поэтому
        в схеме ее нет, ее проверяет сервер.

        Клиент проверяет по #17148 п. 2.3:
        - пусто - «Укажите год рождения»;
        - не 4 цифры - «Введите год рождения в формате YYYY»;
        - меньше 1900 - «Введите корректный год рождения»;
        - больше текущего - «Год рождения не может быть больше текущего года».

        Сервер на любое нарушение отвечает `400 AUTH_BIRTH_YEAR_INVALID`, field `birth_year`,
        текст «Введите корректный год рождения» (#17148 п. 2.4).
      example: 1998
    AuthPassword:
      type: string
      format: password
      minLength: 8
      maxLength: 128
      pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).*$'
      description: |
        Новый пароль (#17148 п. 2.1, #17150 п. 2.1): 8-128 символов, хотя бы одна заглавная и
        одна строчная латинская буква, цифра и специальный символ. Специальный символ - любой,
        кроме латинской буквы и цифры (допущение: набор в требованиях не задан).

        Ошибки, code `AUTH_VALIDATION_ERROR` (#17148 п. 2.3, #17150 п. 2.3):
        - пусто - «Введите пароль», в формах #17150 - «Введите новый пароль»;
        - короче 8 символов - «Пароль должен содержать не менее 8 символов»;
        - длиннее 128 символов - «Пароль должен содержать не более 128 символов» (допущение:
          текста в требованиях нет);
        - нет заглавной буквы, строчной буквы или цифры - «Пароль должен содержать хотя бы одну
          заглавную букву, одну строчную букву и одну цифру»;
        - нет специального символа - «Пароль должен содержать хотя бы одну заглавную букву, одну
          строчную букву, одну цифру и один специальный символ» (допущение: #17148 п. 2.3
          спецсимвол не проверяет, в #17150 п. 2.3 вместо «и» стоит «или»).

        Совпадение с подтверждением («Пароли не совпадают») проверяет только клиент, поле
        подтверждения на сервер не отправляется: в серверных проверках #17148 п. 2.4 его нет.
      example: 'Kino#2026'
    AuthLogin:
      type: string
      minLength: 1
      maxLength: 254
      anyOf:
        - type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
        - type: string
          format: email
      description: |
        Имя пользователя или email (#17149 п. 2.1, п. 2.2 шаг 3). Строка с `@` - email, без `@` -
        имя пользователя.

        Ошибки, code `AUTH_VALIDATION_ERROR`, field `login` (#17149 п. 2.3, #17150 п. 1.2 шаг 4):
        - пусто - «Введите имя пользователя или email»;
        - не имя пользователя по правилам `AuthUsername` и не email - «Введите корректные имя
          пользователя или email».
      example: movie_fan_42
    AuthLinkToken:
      type: string
      minLength: 1
      description: Токен из ссылки в письме. Непрозрачная строка, формат выбирает backend.
      example: 3q2-7wEAAAB5cLkqg1PLSw
    AuthTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/AuthLinkToken'
    AuthRegisterRequest:
      type: object
      required: [username, email, birth_year, password]
      properties:
        username:
          $ref: '#/components/schemas/AuthUsername'
        email:
          $ref: '#/components/schemas/AuthEmail'
        birth_year:
          $ref: '#/components/schemas/AuthBirthYear'
        password:
          $ref: '#/components/schemas/AuthPassword'
    AuthConfirmationSent:
      type: object
      required: [resend_after]
      properties:
        resend_after:
          type: integer
          minimum: 0
          maximum: 60
          description: |
            Через сколько секунд станет доступна кнопка «Отправить повторно» (#17148 п. 2.2
            шаг 10). Сразу после отправки письма - 60.
          example: 60
    AuthResendConfirmationRequest:
      description: Ровно одно из полей - `login` или `token`.
      oneOf:
        - type: object
          required: [login]
          properties:
            login:
              $ref: '#/components/schemas/AuthLogin'
        - type: object
          required: [token]
          properties:
            token:
              $ref: '#/components/schemas/AuthLinkToken'
    AuthLoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          $ref: '#/components/schemas/AuthLogin'
        password:
          type: string
          format: password
          minLength: 1
          description: |
            Пароль. Клиент проверяет только, что поле не пустое: «Введите пароль» (#17149 п. 2.3).
            Строку длиннее 128 символов сервер не хеширует и отвечает `AUTH_INVALID_CREDENTIALS`:
            таких паролей не бывает (#17148 п. 2.1). Поэтому `maxLength` в схеме нет.
        captcha_token:
          type: string
          description: |
            Токен Yandex SmartCaptcha из виджета на форме входа. Нужен, если предыдущий ответ
            пришел с `captcha_required: true`. На каждую попытку - новый токен.
          example: dD0xNzI3NDM0NTY3O2k9MTAuMC4wLjE7
    AuthLoginError:
      description: Ошибка формы входа - `Error` и признак CAPTCHA.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [captcha_required]
          properties:
            captcha_required:
              type: boolean
              description: |
                `true` - следующую попытку надо отправить с `captcha_token`, клиент сразу
                показывает виджет (#17149 п. 2.2 шаг 8, п. 2.5).
    AuthOidcProvider:
      type: string
      enum: [google, yandex, vk]
      description: OIDC-провайдер (#17148 п. 3.1). `vk` - VK ID.
    AuthOidcPending:
      type: object
      required: [kind, provider, email, suggested_username]
      properties:
        kind:
          type: string
          enum: [registration, link]
          description: |
            `registration` - страница «Завершение регистрации» (#17148 п. 3.2 шаг 8).
            `link` - форма входа с сообщением «Учётная запись с email {email} уже существует.
            Войдите с паролем, чтобы привязать {провайдер}» (#17148 п. 3.2 шаг 7).
        provider:
          $ref: '#/components/schemas/AuthOidcProvider'
        email:
          type: string
          format: email
          description: Email из профиля провайдера.
        suggested_username:
          type: string
          nullable: true
          description: |
            Для `registration` - имя пользователя из имени профиля провайдера, при совпадении с
            занятым - со случайным числовым суффиксом (#17148 п. 3.2 шаг 7). Символы вне
            `[A-Za-z0-9_]` транслитерируются или отбрасываются, длина приводится к 3-30
            (допущение: имя профиля может быть на кириллице). Для `link` - `null`.
    AuthOidcCompleteRequest:
      type: object
      required: [username, birth_year]
      properties:
        username:
          $ref: '#/components/schemas/AuthUsername'
        birth_year:
          $ref: '#/components/schemas/AuthBirthYear'
    AuthPasswordResetRequest:
      type: object
      required: [login]
      properties:
        login:
          $ref: '#/components/schemas/AuthLogin'
    AuthPasswordResetCompleteRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          $ref: '#/components/schemas/AuthLinkToken'
        new_password:
          $ref: '#/components/schemas/AuthPassword'
    UserPasswordChangeRequest:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          description: |
            Текущий пароль. Обязателен, если у учетной записи есть пароль (`has_password`);
            пустой - «Введите текущий пароль» (#17150 п. 3.2 шаг 8). Без пароля (учетная запись
            из OIDC) поле не передается (#17150 п. 3.1). Строка длиннее 128 символов -
            `AUTH_CURRENT_PASSWORD_INVALID` без хеширования.
        new_password:
          $ref: '#/components/schemas/AuthPassword'
    SessionInfo:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        expires_at:
          type: string
          format: date-time
          description: Конец сессии - 24 ч с момента входа, не продлевается (#17094 п. 1.3).
          example: '2026-09-28T12:00:00Z'
    UserSummary:
      type: object
      required: [username, avatar_url, has_password]
      properties:
        username:
          type: string
          example: movie_fan_42
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: |
            Фото профиля для аватара в шапке (#17149 п. 2.6). `null` - фото нет, клиент
            показывает иконку «Пользователь» (#17030 п. 2.1.1.1). До работ по профилю (#17030)
            всегда `null`.
        has_password:
          type: boolean
          description: |
            `false` - учетная запись создана через OIDC и пароль не задан: в смене пароля нет
            поля «Текущий пароль» (#17150 п. 3.1).
    UserProfile:
      type: object
      required: [username, birth_year, registered_at, stats]
      properties:
        username:
          type: string
          example: movie_fan_42
        birth_year:
          type: integer
          minimum: 1900
          description: Год рождения, указанный при регистрации.
          example: 1998
        registered_at:
          type: string
          format: date-time
          description: Дата и время регистрации в UTC.
          example: '2026-09-28T12:00:00Z'
        stats:
          type: object
          required: [watched_count, ratings_count, average_rating, reviews_count]
          properties:
            watched_count:
              type: integer
              format: int64
              minimum: 0
              description: Число фильмов в списке «Просмотрено».
              example: 12
            ratings_count:
              type: integer
              format: int64
              minimum: 0
              description: Число оценок пользователя.
              example: 2
            average_rating:
              type: number
              minimum: 0
              maximum: 10
              description: Среднее арифметическое оценок пользователя, 0 при отсутствии оценок.
              example: 8.5
            reviews_count:
              type: integer
              format: int64
              minimum: 0
              description: Число отзывов пользователя.
              example: 0
    MovieCard:
      type: object
      description: >-
        Карточка фильма для блоков 1, 3, 5, 8, 9, 10 #17193. Поля фильма и их пустые значения совпадают с
        таблицей `movies` (#17627, `contracts/db-schema.md`), кроме `poster_url`: в БД лежит
        `poster_path`, полный URL собирает backend, как и у фото актеров. Пустое значение - `null`
        у скалярных полей и `[]` у списков, пустых строк нет. Среднее и число оценок для блока 5
        считаются по `ratings`. Клиент игнорирует незнакомые поля. Остальные блоки можно добавить
        новыми полями или операциями.
      required: [movie_id, title, original_title, year, age_rating, poster_url, runtime_min, overview, genres, countries, crew, actors, average_rating, ratings_count]
      properties:
        movie_id:
          type: integer
          format: int64
          description: Идентификатор фильма TMDB (#17241).
          example: 157336
        title:
          type: string
          minLength: 1
          description: Название на русском (#17193 блок 3, #17640).
          example: Интерстеллар
        original_title:
          type: string
          minLength: 1
          description: Название на языке оригинала (#17193 блок 3).
          example: Interstellar
        year:
          type: integer
          nullable: true
          description: >-
            Год выпуска (#17193 блок 3), как в `MovieSearchResult.year`. Backend берет год из
            `movies.release_date` (#17627). null - дата неизвестна.
          example: 2014
        age_rating:
          type: string
          nullable: true
          enum: ['0+', '6+', '12+', '16+', '18+', null]
          description: >-
            Возрастное ограничение, только российский формат (#17193 блок 3). null - в TMDB
            нет рейтинга для RU (#17640), frontend блок не показывает.
          example: 12+
        poster_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Полный URL постера на CDN TMDB (#17193 блок 1, #17393 п. 2), как в
            `MovieSearchResult`. null - постера нет, frontend показывает заглушку.
          example: https://image.tmdb.org/t/p/w500/poster-157336.jpg
        runtime_min:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Длительность в минутах. Формат «X ч Y мин» собирает frontend (#17193 блок 8). null -
            длительность неизвестна.
          example: 169
        overview:
          type: string
          minLength: 1
          nullable: true
          description: Описание сюжета (#17193 блок 9). null - описания нет.
          example: Группа исследователей отправляется через червоточину искать планету для человечества.
        genres:
          type: array
          description: Жанры (#17193 блок 8) в порядке показа. `[]` - жанров нет.
          items:
            $ref: '#/components/schemas/MovieGenre'
        countries:
          type: array
          description: Страны производства (#17193 блок 8) в порядке показа. `[]` - стран нет.
          items:
            $ref: '#/components/schemas/MovieCountry'
        crew:
          type: array
          description: >-
            Съемочная группа (#17193 блок 8) в порядке показа. Один элемент - одна роль человека:
            режиссер и сценарист в одном лице - два элемента. Единственное или множественное число
            в подписи («Сценарист», «Сценаристы») выбирает frontend по числу элементов роли.
            `[]` - данных нет, frontend строки блока 8 не показывает.
          items:
            $ref: '#/components/schemas/MovieCrewMember'
        actors:
          type: array
          description: >-
            Актеры (#17193 блок 10, #17240) в порядке TMDB, не больше 30 - столько сохраняет
            скрипт каталога (#17640). `[]` - данных нет, frontend блок не показывает.
          items:
            $ref: '#/components/schemas/MovieActor'
        average_rating:
          type: number
          nullable: true
          minimum: 1
          maximum: 10
          description: Среднее всех оценок фильма, округлённое до одного знака. null при отсутствии оценок.
          example: 8.6
        ratings_count:
          type: integer
          format: int64
          minimum: 0
          description: Число оценок фильма, включая сохранённые оценки удалённых пользователей.
          example: 5
    MovieGenre:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          description: id жанра TMDB.
          example: 878
        name:
          type: string
          description: Название на русском.
          example: фантастика
    MovieCountry:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[A-Z]{2}$'
          description: Код ISO 3166-1 alpha-2.
          example: US
        name:
          type: string
          description: Название на русском.
          example: США
    MovieCrewMember:
      type: object
      required: [person_id, name, role]
      properties:
        person_id:
          type: integer
          format: int64
          description: id человека в TMDB.
          example: 525
        name:
          type: string
          example: Кристофер Нолан
        role:
          type: string
          enum: [director, writer, composer, producer]
          description: Режиссер, сценарист, композитор, продюсер (#17193 блок 8).
          example: director
    MovieActor:
      type: object
      required: [person_id, name, character, photo_url]
      properties:
        person_id:
          type: integer
          format: int64
          description: id человека в TMDB.
          example: 3895
        name:
          type: string
          example: Майкл Кейн
        character:
          type: string
          nullable: true
          description: Роль в фильме, подпись под именем (#17240). null - роль в TMDB не указана.
          example: профессор Брэнд
        photo_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Полный URL фото на CDN TMDB, размер w185. null - фото нет, frontend показывает
            заглушку.
          example: https://image.tmdb.org/t/p/w185/profile-3895.jpg
    MovieReviewsPage:
      type: object
      required: [reviews, has_more]
      properties:
        reviews:
          type: array
          maxItems: 10
          description: >-
            Отзывы страницы в порядке `sort`. `[]` - отзывов нет или страница за последней.
          items:
            $ref: '#/components/schemas/MovieReview'
        has_more:
          type: boolean
          description: Есть следующая страница - frontend показывает кнопку «Еще отзывы» (#17239).
        own_review:
          allOf:
            - $ref: '#/components/schemas/MovieReview'
          description: >-
            Собственный отзыв при действующей сессии, если он есть. Возвращается только на первой
            странице и отображается перед массивом reviews при любой сортировке.
    MovieReview:
      type: object
      description: Отзыв о фильме (#17239), поля - из формы отзыва #17029 п. 1 и таблицы `reviews`.
      required: [review_id, username, created_at, is_edited, verdict, title, body, likes, dislikes]
      properties:
        review_id:
          type: integer
          format: int64
          example: 42
        username:
          type: string
          nullable: true
          description: >-
            Никнейм автора. null - профиль удален, frontend пишет «Удаленный пользователь»
            (#17030 п. 3).
          example: movie_fan_42
        created_at:
          type: string
          format: date-time
          description: >-
            Дата создания в UTC. Вид «12 ноября 2024, 15:37» в часовом поясе пользователя собирает
            frontend (#17239).
          example: '2026-11-12T08:37:00Z'
        is_edited:
          type: boolean
          description: Отзыв редактировался - пометка «Редактирован» рядом с датой (#17029 п. 3).
        verdict:
          type: string
          enum: [positive, neutral, negative]
          description: >-
            «Положительно», «Нейтрально», «Негативно» (#17029 п. 1.1), подписи - на frontend.
          example: positive
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 150
          description: Заголовок (#17029 п. 1.2). null - отзыв без заголовка.
          example: Космос, время и отцовство
        body:
          type: string
          minLength: 300
          maxLength: 10000
          description: Текст отзыва (#17029 п. 1.3).
        likes:
          type: integer
          minimum: 0
          description: Реакций «палец вверх» (#17029 п. 5).
          example: 12
        dislikes:
          type: integer
          minimum: 0
          description: >-
            Реакций «палец вниз». «+N», «-N» или «0» под отзывом - разница `likes - dislikes`
            (#17239); число реакций каждого вида - #17029 п. 5.
          example: 3
    ReviewFields:
      type: object
      properties:
        verdict:
          type: string
          enum: [positive, neutral, negative]
        title:
          type: string
          nullable: true
          maxLength: 150
          pattern: '^[^\u0000]*$'
          description: Пустая строка и null означают отсутствие заголовка.
        body:
          type: string
          minLength: 300
          maxLength: 10000
          pattern: '^[^\u0000]*$'
    CreateReviewRequest:
      allOf:
        - $ref: '#/components/schemas/ReviewFields'
        - type: object
          required: [verdict, body]
    UpdateReviewRequest:
      allOf:
        - $ref: '#/components/schemas/ReviewFields'
        - type: object
          anyOf:
            - required: [verdict]
            - required: [title]
            - required: [body]
    MyReviewsPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/MyReviewItem'
        total:
          type: integer
          minimum: 0
          description: Число отзывов с учётом поиска. Число страниц равно ceil(total / 24).
    MyReviewItem:
      type: object
      required: [movie, review]
      properties:
        movie:
          $ref: '#/components/schemas/UserListMovie'
        review:
          $ref: '#/components/schemas/MovieReview'
    UserListPage:
      type: object
      required: [movies, total]
      properties:
        movies:
          type: array
          maxItems: 24
          description: >-
            Фильмы страницы в порядке `sort`. `[]` - список пуст, по `q` ничего не нашлось или
            страница за последней.
          items:
            $ref: '#/components/schemas/UserListMovie'
        total:
          type: integer
          minimum: 0
          description: >-
            Сколько фильмов списка подходит под `q`, без `q` - сколько в списке всего. Число
            страниц для пагинации и «Страница X из Y» (#17030 п. 2.4.3) - `ceil(total / 24)`.
          example: 30
    UserListMovie:
      type: object
      description: Плитка фильма в списке профиля (#17030 п. 2.2.1.1, 2.2.2.1, 2.3.4.1).
      required: [movie_id, title, poster_url, average_rating, user_rating]
      properties:
        movie_id:
          type: integer
          format: int64
          description: >-
            Идентификатор фильма TMDB (#17241). По нему frontend открывает карточку фильма
            (#17030 п. 2.2.1.2).
          example: 157336
        title:
          type: string
          minLength: 1
          description: Название на русском, как в `MovieCard.title`.
          example: Интерстеллар
        poster_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Полный URL постера на CDN TMDB, как в `MovieCard`. null - постера нет, frontend
            показывает заглушку.
          example: https://image.tmdb.org/t/p/w500/poster-157336.jpg
        average_rating:
          type: number
          nullable: true
          minimum: 1
          maximum: 10
          description: >-
            Средняя оценка пользователей платформы с одним знаком после запятой (#17028,
            `round(avg(score), 1)` по `ratings` в `contracts/db-schema.md`). null - оценок нет.
          example: 8.6
        user_rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: >-
            Оценка текущего пользователя (#17028). null - не выставлена, на плитке кнопка
            «Оценить» (#17030 п. 2.2.1.1.4).
          example: 9
    UserMovieState:
      type: object
      description: Оценка и состояние списков текущего пользователя на странице фильма (блоки 5–7 #17193).
      required: [want_to_watch, watched, user_rating]
      properties:
        want_to_watch:
          type: boolean
          description: Фильм в списке «Хочу посмотреть», чекбокс установлен (#17026).
        watched:
          type: boolean
          description: Фильм в списке «Просмотрено», чекбокс установлен (#17027).
        user_rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: Оценка текущего пользователя. null, если оценки нет.
          example: 9
  responses:
    Unauthorized:
      description: Нет сессии или сессия истекла (#17094 п. 1.1, 1.3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        Превышен лимит 100 запросов в минуту (#17094 п. 3.4), code `RATE_LIMITED`. Отвечает nginx
        (`limit_req`, wiki `Nginx`): тело и `Retry-After` задаются в его конфиге, `Retry-After` -
        постоянное число.
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Слишком много запросов. Попробуйте позже
    InternalError:
      description: Непредвиденная ошибка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Произошла ошибка. Попробуйте позже
    SearchUnavailable:
      description: >-
        Поиск временно недоступен (#17152 п. 8, #17153 п. 9, #17154 п. 9). Результатов в ответе нет:
        вместо ошибки нерелевантная выдача не отдается (#17153 п. 9.1). Коды общие с контрактом
        backend - ML-сервис (#17626).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchError'
          examples:
            SEARCH_UNAVAILABLE:
              summary: 'ML-сервис недоступен или не ответил в таймаут (риск #17296)'
              value:
                code: SEARCH_UNAVAILABLE
                message: Поиск временно недоступен. Попробуйте позже
            SERVER_BUSY:
              summary: Перегрузка, ответ не дольше 5 с (#17093 п. 5.1)
              value:
                code: SERVER_BUSY
                message: Сервис перегружен. Попробуйте позже
    # --- #17629 ---
    SessionCreated:
      description: Создана сессия, установлена cookie `dv_session`.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SessionSetCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionInfo'
          example:
            user:
              username: movie_fan_42
              avatar_url: null
              has_password: true
            expires_at: '2026-09-28T12:00:00Z'
    AuthOidcExpired:
      description: |
        Нет cookie `dv_oidc` или истекли 30 минут на завершение входа через OIDC. Клиент
        возвращает пользователя на форму входа или регистрации. Если провайдер неизвестен
        (cookie нет), текст без «через {провайдер}» (допущение).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_OIDC_EXPIRED
            message: Не удалось выполнить вход через Google. Попробуйте снова или используйте другой способ
            field: null
    AuthResetLinkExpired:
      description: |
        Ссылка сброса пароля истекла, заменена новой или уже использована (#17150 п. 2.2
        шаг 2, п. 2.4). Клиент показывает кнопку «Запросить повторно», она ведет к форме запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_RESET_LINK_EXPIRED
            message: Срок действия ссылки истёк. Запросите восстановление пароля повторно
            field: null
  parameters:
    AuthOidcProviderPath:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AuthOidcProvider'
    AuthOidcCookie:
      name: dv_oidc
      in: cookie
      required: true
      description: Cookie незавершенного входа через OIDC, см. тег OIDC.
      schema:
        type: string
    ListTypePath:
      name: list_type
      in: path
      required: true
      description: '`want_to_watch` - «Хочу посмотреть» (#17026), `watched` - «Просмотрено» (#17027).'
      schema:
        type: string
        enum: [want_to_watch, watched]
      example: want_to_watch
  headers:
    SessionSetCookie:
      description: |
        `dv_session=<id>; HttpOnly; Secure; SameSite=Lax; Path=/api/v1; Max-Age=86400`.
        `<id>` - случайный идентификатор, в PostgreSQL хранится его хеш (wiki `PostgreSQL`).
      schema:
        type: string
      example: 'dv_session=Yp3kq0vN8m2xR5tL; HttpOnly; Secure; SameSite=Lax; Path=/api/v1; Max-Age=86400'
    SessionClearCookie:
      description: Стирает cookie `dv_session`.
      schema:
        type: string
      example: 'dv_session=; Path=/api/v1; Max-Age=0'
paths:
  /search/image:
    post:
      operationId: searchByImage
      tags: [search]
      summary: Поиск фильма по изображению
      description: |
        Кадр, скриншот, постер или титр (#17153 п. 1.2) - на выходе один наиболее релевантный
        фильм (#17153 п. 6.1). Только для авторизованного пользователя (#17153 п. 1.1,
        #17243 п. 4.3, 5.3): без сессии - 401, frontend открывает форму входа.

        **Время.** Запрос синхронный: один HTTP-запрос без очереди и опроса статуса (wiki
        `Стек_технологий`, разд. 7). Ответ - не дольше 10 с для 95% запросов (#17093 п. 2.3),
        отсчет с момента, когда тело запроса получено целиком. Загрузка файла до 10 МБ - не
        дольше 5 с (#17093 п. 3.1). При перегрузке 503 `SERVER_BUSY` приходит не дольше чем
        через 5 с (#17093 п. 5.1). Лимит - 100 запросов в минуту на сессию (#17094 п. 3.4).

        **Ограничения и ошибки** (#17153 п. 4.2, 8.1). 1 МБ = 1 048 576 байт, границы
        включительно. Формат определяется по содержимому файла, а не по расширению. Если
        нарушений несколько, в ответе одно - первое в порядке проверки: наличие файла, число
        файлов, размер, формат, целостность.

        | #17153 | Условие | HTTP | code |
        |---|---|---|---|
        | 8.1.1 | изображение не загружено и не вставлено | 400 | `FILE_REQUIRED` |
        | 8.1.2 | больше одного файла | 400 | `TOO_MANY_FILES` |
        | 8.1.3 | формат не JPG, JPEG, PNG или WEBP | 415 | `UNSUPPORTED_FORMAT` |
        | 8.1.4 | размер больше 10 МБ | 413 | `FILE_TOO_LARGE` |
        | 8.1.5 | файл поврежден или не обрабатывается | 422 | `FILE_CORRUPTED` |

        Пример запроса:

        ```
        curl -X POST https://<host>/api/v1/search/image \
          -b 'dv_session=<идентификатор сессии>' \
          -F 'file=@frame.jpg;type=image/jpeg'
        ```
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SearchImageRequest'
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
            examples:
              frame:
                summary: Кадр из фильма, JPG
                value:
                  file: <бинарное содержимое frame.jpg>
      responses:
        '200':
          description: >-
            Поиск выполнен. Пустой `results` - релевантный фильм не найден (#17153 п. 7.1): это не
            ошибка, frontend показывает сообщение об отсутствии результата.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                found:
                  summary: Фильм найден
                  value:
                    results:
                      - movie_id: 603
                        title: Матрица
                        year: 1999
                        poster_url: https://image.tmdb.org/t/p/w500/poster-603.jpg
                        overview: Хакер Нео узнает, что мир вокруг - компьютерная симуляция.
                empty:
                  summary: Ничего не найдено (#17153 п. 7)
                  value:
                    results: []
        '400':
          description: Файла нет или их больше одного (#17153 п. 8.1.1, 8.1.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                FILE_REQUIRED:
                  summary: 8.1.1 - изображение не загружено
                  value:
                    code: FILE_REQUIRED
                    message: 'Невозможно выполнить поиск по изображению: изображение не загружено'
                    field: file
                TOO_MANY_FILES:
                  summary: 8.1.2 - больше одного файла
                  value:
                    code: TOO_MANY_FILES
                    message: 'Невозможно выполнить поиск по изображению: загружено больше одного файла'
                    field: file
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: >-
            Файл больше 10 МБ (#17153 п. 8.1.4). Тело больше лимита nginx (`client_max_body_size`,
            wiki `Nginx`) отклоняет nginx, ответ тот же: JSON с кодом `FILE_TOO_LARGE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                FILE_TOO_LARGE:
                  summary: 8.1.4 - размер больше 10 МБ
                  value:
                    code: FILE_TOO_LARGE
                    message: 'Невозможно выполнить поиск по изображению: размер файла больше 10 МБ'
                    field: file
        '415':
          description: Формат не JPG, JPEG, PNG или WEBP (#17153 п. 8.1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                UNSUPPORTED_FORMAT:
                  summary: 8.1.3 - неподдерживаемый формат
                  value:
                    code: UNSUPPORTED_FORMAT
                    message: 'Невозможно выполнить поиск по изображению: поддерживаются только JPG, JPEG, PNG и WEBP'
                    field: file
        '422':
          description: Файл поврежден или не может быть обработан (#17153 п. 8.1.5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                FILE_CORRUPTED:
                  summary: 8.1.5 - файл поврежден
                  value:
                    code: FILE_CORRUPTED
                    message: 'Невозможно выполнить поиск по изображению: файл поврежден или не может быть обработан'
                    field: file
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /search/video:
    post:
      operationId: searchByVideo
      tags: [search]
      summary: Поиск фильма по видеофрагменту
      description: |
        Короткая сцена или фрагмент видео (#17154 п. 1.2) - на выходе один наиболее релевантный
        фильм (#17154 п. 6.1). Только для авторизованного пользователя (#17154 п. 1.1,
        #17243 п. 4.3, 5.4): без сессии - 401, frontend открывает форму входа.

        **Время.** Запрос синхронный: один HTTP-запрос без очереди и опроса статуса (wiki
        `Стек_технологий`, разд. 7). Ответ - не дольше 15 с для 95% запросов (#17093 п. 2.4),
        отсчет с момента, когда тело запроса получено целиком. Загрузка файла до 50 МБ - не
        дольше 30 с (#17093 п. 3.2). При перегрузке 503 `SERVER_BUSY` приходит не дольше чем
        через 5 с (#17093 п. 5.1). Лимит - 100 запросов в минуту на сессию (#17094 п. 3.4).

        **Загрузка и обработка** идут в одном запросе: прогресс загрузки клиент видит по отправке
        тела, после отправки ждет ответа (#17625). Отмена на любом этапе - клиент обрывает запрос.

        **Ограничения и ошибки** (#17154 п. 4.2, 8.1). 1 МБ = 1 048 576 байт, границы
        включительно. Формат определяется по содержимому файла, а не по расширению. Если
        нарушений несколько, в ответе одно - первое в порядке проверки: наличие файла, число
        файлов, размер, формат, длительность, целостность.

        | #17154 | Условие | HTTP | code |
        |---|---|---|---|
        | 8.1.1 | видеофрагмент не загружен | 400 | `FILE_REQUIRED` |
        | 8.1.2 | больше одного файла | 400 | `TOO_MANY_FILES` |
        | 8.1.3 | формат не MP4, MOV или WEBM | 415 | `UNSUPPORTED_FORMAT` |
        | 8.1.4 | длительность больше 30 с | 422 | `VIDEO_TOO_LONG` |
        | 8.1.5 | размер больше 50 МБ | 413 | `FILE_TOO_LARGE` |
        | 8.1.6 | файл поврежден или не обрабатывается | 422 | `FILE_CORRUPTED` |

        Пример запроса:

        ```
        curl -X POST https://<host>/api/v1/search/video \
          -b 'dv_session=<идентификатор сессии>' \
          -F 'file=@scene.mp4;type=video/mp4'
        ```
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SearchVideoRequest'
            encoding:
              file:
                contentType: video/mp4, video/quicktime, video/webm
            examples:
              scene:
                summary: Сцена из фильма, MP4
                value:
                  file: <бинарное содержимое scene.mp4>
      responses:
        '200':
          description: >-
            Поиск выполнен. Пустой `results` - релевантный фильм не найден (#17154 п. 7.1): это не
            ошибка, frontend показывает сообщение об отсутствии результата.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                found:
                  summary: Фильм найден
                  value:
                    results:
                      - movie_id: 27205
                        title: Начало
                        year: 2010
                        poster_url: https://image.tmdb.org/t/p/w500/poster-27205.jpg
                        overview: Кобб крадет идеи из снов, а теперь должен внедрить идею в чужое подсознание.
                empty:
                  summary: Ничего не найдено (#17154 п. 7)
                  value:
                    results: []
        '400':
          description: Файла нет или их больше одного (#17154 п. 8.1.1, 8.1.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                FILE_REQUIRED:
                  summary: 8.1.1 - видеофрагмент не загружен
                  value:
                    code: FILE_REQUIRED
                    message: 'Невозможно выполнить поиск по видеофрагменту: видеофрагмент не загружен'
                    field: file
                TOO_MANY_FILES:
                  summary: 8.1.2 - больше одного файла
                  value:
                    code: TOO_MANY_FILES
                    message: 'Невозможно выполнить поиск по видеофрагменту: загружено больше одного файла'
                    field: file
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: >-
            Файл больше 50 МБ (#17154 п. 8.1.5). Тело больше лимита nginx (`client_max_body_size`,
            wiki `Nginx`) отклоняет nginx, ответ тот же: JSON с кодом `FILE_TOO_LARGE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                FILE_TOO_LARGE:
                  summary: 8.1.5 - размер больше 50 МБ
                  value:
                    code: FILE_TOO_LARGE
                    message: 'Невозможно выполнить поиск по видеофрагменту: размер файла больше 50 МБ'
                    field: file
        '415':
          description: Формат не MP4, MOV или WEBM (#17154 п. 8.1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                UNSUPPORTED_FORMAT:
                  summary: 8.1.3 - неподдерживаемый формат
                  value:
                    code: UNSUPPORTED_FORMAT
                    message: 'Невозможно выполнить поиск по видеофрагменту: поддерживаются только MP4, MOV и WEBM'
                    field: file
        '422':
          description: >-
            Видео длиннее 30 с (#17154 п. 8.1.4) или файл поврежден и не может быть обработан
            (#17154 п. 8.1.6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                VIDEO_TOO_LONG:
                  summary: 8.1.4 - длительность больше 30 с
                  value:
                    code: VIDEO_TOO_LONG
                    message: 'Невозможно выполнить поиск по видеофрагменту: видео длиннее 30 секунд'
                    field: file
                FILE_CORRUPTED:
                  summary: 8.1.6 - файл поврежден
                  value:
                    code: FILE_CORRUPTED
                    message: 'Невозможно выполнить поиск по видеофрагменту: файл поврежден или не может быть обработан'
                    field: file
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /search/audio:
    post:
      operationId: searchByAudio
      tags: [search]
      summary: Поиск фильма по аудиофрагменту
      description: |
        Реплика, музыка или звуковая сцена (#17155 п. 1.2, 4.1) - на выходе один наиболее
        релевантный фильм (#17155 п. 6.1). Только для авторизованного пользователя (#17155 п. 1.1,
        #17243 п. 4.3, 5.5): без сессии - 401, frontend открывает форму входа.

        **Время.** Запрос синхронный: один HTTP-запрос без очереди и опроса статуса (wiki
        `Стек_технологий`, разд. 7). Ответ - не дольше 15 с для 95% запросов (#17093 п. 2.5),
        отсчет с момента, когда тело запроса получено целиком. Загрузка файла до 20 МБ - не
        дольше 10 с (#17093 п. 3.3). При перегрузке 503 `SERVER_BUSY` приходит не дольше чем
        через 5 с (#17093 п. 5.1). Лимит - 100 запросов в минуту на сессию (#17094 п. 3.4).

        **Запись с микрофона** (#17155 п. 3.2). Браузеры пишут звук в WEBM (Chrome) или OGG
        (Firefox), а WEBM в #17155 п. 4.2.2 нет. Поэтому frontend перекодирует запись в WAV и
        отправляет в поле `file`, как выбранный файл. 10 с в WAV - 1-2 МБ, в лимит 20 МБ
        укладывается.

        **Ограничения и ошибки** (#17155 п. 4.2, 8.1). 1 МБ = 1 048 576 байт, границы
        включительно. Формат определяется по содержимому файла, а не по расширению. Если
        нарушений несколько, в ответе одно - первое в порядке проверки: наличие файла, число
        файлов, размер, формат, длительность, целостность. Длительность и целостность проверяет
        ML-сервис (`contracts/backend-ml.md`, разд. 2).

        | #17155 | Условие | HTTP | code |
        |---|---|---|---|
        | 8.1.1 | аудиофрагмент не загружен и не записан | 400 | `FILE_REQUIRED` |
        | 8.1.2 | больше одного файла | 400 | `TOO_MANY_FILES` |
        | 8.1.3 | формат не MP3, WAV, OGG или M4A | 415 | `UNSUPPORTED_FORMAT` |
        | 8.1.4 | длительность больше 10 с | 422 | `AUDIO_TOO_LONG` |
        | 8.1.5 | размер больше 20 МБ | 413 | `FILE_TOO_LARGE` |
        | 8.1.6 | файл поврежден или не обрабатывается | 422 | `FILE_CORRUPTED` |
        | 8.1.7 | нет доступа к микрофону | - | - |

        8.1.7 проверяет браузер: без разрешения записи нет, запрос не отправляется. Frontend
        показывает сообщение в области сообщений (#17155 п. 8.2) и оставляет возможность разрешить
        доступ или загрузить файл (п. 8.3).

        Пример запроса:

        ```
        curl -X POST https://<host>/api/v1/search/audio \
          -b 'dv_session=<идентификатор сессии>' \
          -F 'file=@clip.mp3;type=audio/mpeg'
        ```
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SearchAudioRequest'
            encoding:
              file:
                contentType: audio/mpeg, audio/wav, audio/ogg, audio/mp4
            examples:
              clip:
                summary: Фрагмент саундтрека, MP3
                value:
                  file: <бинарное содержимое clip.mp3>
              recording:
                summary: Запись с микрофона, WAV
                value:
                  file: <бинарное содержимое recording.wav>
      responses:
        '200':
          description: >-
            Поиск выполнен. Пустой `results` - релевантный фильм не найден (#17155 п. 7.1): это не
            ошибка, frontend показывает сообщение об отсутствии результата.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                found:
                  summary: Фильм найден
                  value:
                    results:
                      - movie_id: 157336
                        title: Интерстеллар
                        year: 2014
                        poster_url: https://image.tmdb.org/t/p/w500/poster-157336.jpg
                        overview: Группа исследователей отправляется через червоточину искать планету для человечества.
                empty:
                  summary: Ничего не найдено (#17155 п. 7)
                  value:
                    results: []
        '400':
          description: Файла нет или их больше одного (#17155 п. 8.1.1, 8.1.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                FILE_REQUIRED:
                  summary: 8.1.1 - аудиофрагмент не загружен и не записан
                  value:
                    code: FILE_REQUIRED
                    message: 'Невозможно выполнить поиск по аудиофрагменту: аудиофрагмент не загружен и не записан'
                    field: file
                TOO_MANY_FILES:
                  summary: 8.1.2 - больше одного файла
                  value:
                    code: TOO_MANY_FILES
                    message: 'Невозможно выполнить поиск по аудиофрагменту: загружено больше одного файла'
                    field: file
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: >-
            Файл больше 20 МБ (#17155 п. 8.1.5). Тело больше лимита nginx (`client_max_body_size`,
            wiki `Nginx`) отклоняет nginx, ответ тот же: JSON с кодом `FILE_TOO_LARGE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                FILE_TOO_LARGE:
                  summary: 8.1.5 - размер больше 20 МБ
                  value:
                    code: FILE_TOO_LARGE
                    message: 'Невозможно выполнить поиск по аудиофрагменту: размер файла больше 20 МБ'
                    field: file
        '415':
          description: Формат не MP3, WAV, OGG или M4A (#17155 п. 8.1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                UNSUPPORTED_FORMAT:
                  summary: 8.1.3 - неподдерживаемый формат
                  value:
                    code: UNSUPPORTED_FORMAT
                    message: 'Невозможно выполнить поиск по аудиофрагменту: поддерживаются только MP3, WAV, OGG и M4A'
                    field: file
        '422':
          description: >-
            Аудио длиннее 10 с (#17155 п. 8.1.4) или файл поврежден и не может быть обработан
            (#17155 п. 8.1.6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                AUDIO_TOO_LONG:
                  summary: 8.1.4 - длительность больше 10 с
                  value:
                    code: AUDIO_TOO_LONG
                    message: 'Невозможно выполнить поиск по аудиофрагменту: аудиофрагмент длиннее 10 секунд'
                    field: file
                FILE_CORRUPTED:
                  summary: 8.1.6 - файл поврежден
                  value:
                    code: FILE_CORRUPTED
                    message: 'Невозможно выполнить поиск по аудиофрагменту: файл поврежден или не может быть обработан'
                    field: file
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /search/text:
    post:
      operationId: searchByText
      tags: [search]
      summary: Поиск фильма по текстовому описанию
      description: |
        В Sprint 1 не реализуется. Описан заранее: это единственный режим, доступный гостю.

        Описание сюжета, сцены, персонажей, реплик, жанра или года (#17152 п. 3.1-3.3) - на выходе
        до 10 фильмов по убыванию релевантности (#17152 п. 4.3, 4.4). Доступен гостю и
        авторизованному пользователю (#17152 п. 1.1, #17243 п. 4.1, 5.1), поэтому `security: []`:
        сессия не нужна, 401 здесь не бывает.

        **Время.** Ответ - не дольше 5 с для 95% запросов (#17093 п. 2.2). Лимит - 100 запросов
        в минуту на сессию, для гостя на IP (#17094 п. 3.4, wiki `Nginx`).

        **Ограничения и ошибки** (#17152 п. 3.4, 7.1). Длина считается в символах Unicode после
        обрезки пробелов по краям, строка из одних пробелов - пустой запрос. Проверки идут в
        порядке таблицы, в ответе одна ошибка.

        | #17152 | Условие | HTTP | code |
        |---|---|---|---|
        | 7.1.1 | запрос пустой | 400 | `QUERY_EMPTY` |
        | 7.1.2 | меньше 3 символов | 422 | `QUERY_TOO_SHORT` |
        | 7.1.3 | больше 250 символов | 422 | `QUERY_TOO_LONG` |
        | 7.1.4 | недопустимое или вредоносное содержимое | 422 | `QUERY_NOT_ALLOWED` |

        Критерии 7.1.4 в требованиях не заданы: пока их нет, backend этот код не возвращает.

        Пример запроса:

        ```
        curl -X POST https://<host>/api/v1/search/text \
          -H 'Content-Type: application/json' \
          -d '{"query": "фильм, где хакеру предлагают выбрать красную или синюю таблетку"}'
        ```
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTextRequest'
            examples:
              scene:
                summary: Описание сцены
                value:
                  query: фильм, где хакеру предлагают выбрать красную или синюю таблетку
      responses:
        '200':
          description: >-
            Поиск выполнен. Пустой `results` - ничего не найдено (#17152 п. 6.1): это не ошибка,
            подсказку из #17152 п. 6.4 показывает frontend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                found:
                  summary: Найдено несколько фильмов, у последнего нет года, постера и описания
                  value:
                    results:
                      - movie_id: 603
                        title: Матрица
                        year: 1999
                        poster_url: https://image.tmdb.org/t/p/w500/poster-603.jpg
                        overview: Хакер Нео узнает, что мир вокруг - компьютерная симуляция.
                      - movie_id: 604
                        title: 'Матрица: Перезагрузка'
                        year: 2003
                        poster_url: https://image.tmdb.org/t/p/w500/poster-604.jpg
                        overview: Нео и его соратники защищают Зион от машин.
                      - movie_id: 1000001
                        title: Фильм без постера
                        year: null
                        poster_url: null
                        overview: null
                empty:
                  summary: Ничего не найдено (#17152 п. 6)
                  value:
                    results: []
        '400':
          description: Запрос пустой (#17152 п. 7.1.1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                QUERY_EMPTY:
                  summary: 7.1.1 - запрос пустой
                  value:
                    code: QUERY_EMPTY
                    message: 'Невозможно выполнить поиск по запросу: запрос пустой'
                    field: query
        '422':
          description: >-
            Запрос короче 3 или длиннее 250 символов либо содержит недопустимое содержимое
            (#17152 п. 7.1.2-7.1.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchError'
              examples:
                QUERY_TOO_SHORT:
                  summary: 7.1.2 - меньше 3 символов
                  value:
                    code: QUERY_TOO_SHORT
                    message: 'Невозможно выполнить поиск по запросу: запрос короче 3 символов'
                    field: query
                QUERY_TOO_LONG:
                  summary: 7.1.3 - больше 250 символов
                  value:
                    code: QUERY_TOO_LONG
                    message: 'Невозможно выполнить поиск по запросу: запрос длиннее 250 символов'
                    field: query
                QUERY_NOT_ALLOWED:
                  summary: 7.1.4 - недопустимое содержимое
                  value:
                    code: QUERY_NOT_ALLOWED
                    message: 'Невозможно выполнить поиск по запросу: запрос содержит недопустимое содержимое'
                    field: query
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Регистрация по имени пользователя, email и паролю
      description: |
        #17148 п. 2. Создает учетную запись со статусом «Не подтверждена», сохраняет год рождения
        и ставит в очередь письмо со ссылкой подтверждения (#17148 п. 2.2 шаг 9, п. 2.5). Сессия
        не создается: вход - после подтверждения email.

        После 201 клиент показывает «На адрес {email} отправлено письмо. Перейдите по ссылке в
        письме для завершения регистрации» и кнопку «Отправить повторно», доступную через
        `resend_after` секунд (#17148 п. 2.2 шаг 10).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
            example:
              username: movie_fan_42
              email: ivan@example.com
              birth_year: 1998
              password: 'Kino#2026'
      responses:
        '201':
          description: Учетная запись создана, письмо поставлено в очередь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfirmationSent'
              example:
                resend_after: 60
        '400':
          description: Нарушены правила полей (#17148 п. 2.3, 2.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                username_short:
                  value:
                    code: AUTH_VALIDATION_ERROR
                    message: Имя пользователя должно содержать не менее 3 символов
                    field: username
                password_weak:
                  value:
                    code: AUTH_VALIDATION_ERROR
                    message: Пароль должен содержать хотя бы одну заглавную букву, одну строчную букву и одну цифру
                    field: password
                birth_year_invalid:
                  value:
                    code: AUTH_BIRTH_YEAR_INVALID
                    message: Введите корректный год рождения
                    field: birth_year
        '409':
          description: Email или имя пользователя заняты (#17148 п. 2.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                email_taken:
                  value:
                    code: AUTH_EMAIL_TAKEN
                    message: Пользователь с таким email уже существует
                    field: email
                username_taken:
                  value:
                    code: AUTH_USERNAME_TAKEN
                    message: Это имя пользователя уже занято
                    field: username
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/confirm-email:
    post:
      tags: [Auth]
      operationId: confirmEmail
      summary: Подтверждение email по ссылке из письма
      description: |
        Ссылка в письме ведет на страницу SPA `/confirm-email?token=...` (маршрут - предложение,
        согласуется в #17634), страница отправляет токен сюда. Ссылка прямо на API с GET не
        подходит: почтовые сканеры открывают ссылки из писем и израсходовали бы токен, а cookie
        сессии досталась бы сканеру.

        Успех (#17148 п. 2.2 шаг 12, п. 2.5): статус «Активна», создана сессия. Клиент уходит на
        главную с уведомлением «Email подтверждён. Добро пожаловать в DejaView!».

        Ссылка живет 24 ч, действует только последняя отправленная (#17148 п. 2.5). Истекшая,
        замененная новой или уже использованная ссылка - `410 AUTH_CONFIRMATION_LINK_EXPIRED`:
        клиент показывает «Срок действия ссылки истёк» и кнопку «Отправить новую ссылку»
        (`POST /auth/resend-confirmation` с этим же токеном). Использованную ссылку требования не
        описывают, ответ как для истекшей (допущение, по аналогии с #17150 п. 2.2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
            example:
              token: 3q2-7wEAAAB5cLkqg1PLSw
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '410':
          description: Ссылка истекла, заменена новой или уже использована (#17148 п. 2.5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTH_CONFIRMATION_LINK_EXPIRED
                message: Срок действия ссылки истёк
                field: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/resend-confirmation:
    post:
      tags: [Auth]
      operationId: resendEmailConfirmation
      summary: Повторная отправка письма подтверждения
      description: |
        Кнопки «Отправить повторно» и «Отправить новую ссылку» (#17148 п. 2.2 шаг 10, п. 2.5).
        Что передает клиент:
        - страница после регистрации - `login` = email из формы;
        - ошибка входа `AUTH_EMAIL_NOT_CONFIRMED` - `login` из формы входа, там может быть имя
          пользователя (#17148 п. 2.5, #17149 п. 2.4);
        - страница истекшей ссылки - `token` из этой ссылки. Сервер находит по нему учетную
          запись и после истечения срока.

        Новая ссылка аннулирует предыдущую (#17148 п. 2.5). Письмо уходит не чаще раза в 60
        секунд (#17148 п. 2.2 шаг 10): если 60 секунд не прошло, письмо не отправляется, а
        `resend_after` - остаток. Если учетной записи нет или она уже подтверждена, письмо не
        отправляется, ответ такой же, как при отправке.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResendConfirmationRequest'
            examples:
              by_login:
                value:
                  login: ivan@example.com
              by_token:
                value:
                  token: 3q2-7wEAAAB5cLkqg1PLSw
      responses:
        '202':
          description: Запрос принят, `resend_after` - когда можно повторить.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfirmationSent'
              examples:
                sent:
                  value:
                    resend_after: 60
                too_early:
                  value:
                    resend_after: 42
        '400':
          description: Неверный формат `login` (#17149 п. 2.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTH_VALIDATION_ERROR
                message: Введите корректные имя пользователя или email
                field: login
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вход по имени пользователя или email и паролю
      description: |
        #17149 п. 2. Успех - новая сессия; прежняя сессия из cookie, если была, удаляется.

        **Защита от подбора** (#17149 п. 2.5, #17094 п. 3.3). Счетчик неудачных попыток подряд
        ведется на учетную запись, найденную по `login`. Порядок проверок:
        1. Вход заблокирован после 5 неудачных попыток - `429 AUTH_LOGIN_LOCKED` с `Retry-After`,
           пароль не проверяется. Блокировка 15 минут.
        2. После 3 неудачных попыток вход требует CAPTCHA. Без `captcha_token` -
           `403 AUTH_CAPTCHA_REQUIRED`, с непрошедшим проверку токеном - `403 AUTH_CAPTCHA_INVALID`.
           Эти ответы неудачной попыткой не считаются.
        3. Неверный пароль - `400 AUTH_INVALID_CREDENTIALS`, счетчик +1. Текст по виду `login`:
           с `@` - про email, без - про имя пользователя (#17149 п. 2.4). В ответе
           `captcha_required: true`, если следующая попытка уже требует CAPTCHA: клиент
           показывает виджет вместе с ошибкой (#17149 п. 2.2 шаг 8). Пятая неудачная попытка подряд
           сразу отвечает `429 AUTH_LOGIN_LOCKED`.
        4. Верный пароль, статус «Не подтверждена» - `403 AUTH_EMAIL_NOT_CONFIRMED`, клиент
           показывает кнопку «Отправить новую ссылку» (`POST /auth/resend-confirmation` с тем же
           `login`). Заблокирована - `403 AUTH_ACCOUNT_BLOCKED`. Эти статусы видны только после
           верного пароля.
        5. Успешный вход или конец блокировки сбрасывают счетчик (#17149 п. 2.5). Верный пароль
           в шаге 4 тоже сбрасывает: это не подбор (допущение).

        Если `login` не найден или у учетной записи нет пароля (создана через OIDC), ответ
        `AUTH_INVALID_CREDENTIALS`. Для несуществующего `login` счетчика нет, CAPTCHA и
        блокировка не включаются: занятость email и имени и так видна при регистрации
        (#17148 п. 2.4).

        **CAPTCHA.** Виджет Yandex SmartCaptcha на клиенте, ключ клиента задается при сборке
        frontend. Токен из виджета клиент кладет в `captcha_token`, backend проверяет его
        запросом к SmartCaptcha (wiki `API_service`). Отдельного запроса «нужна ли CAPTCHA» нет:
        клиент узнает об этом из `captcha_required` или кода `AUTH_CAPTCHA_REQUIRED`, после
        прохождения виджета отправляет форму снова.

        **Привязка OIDC.** Если есть cookie `dv_oidc` с исходом `link_required` (тег OIDC) и вход
        выполнен в учетную запись с тем же email, провайдер привязывается к ней (#17148 п. 3.2
        шаг 7), cookie стирается. Вход в другую учетную запись привязку отменяет.
      security: []
      parameters:
        - name: dv_oidc
          in: cookie
          required: false
          description: Есть, если вход идет после исхода OIDC `link_required`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              by_username:
                value:
                  login: movie_fan_42
                  password: 'Kino#2026'
              with_captcha:
                value:
                  login: ivan@example.com
                  password: 'Kino#2026'
                  captcha_token: dD0xNzI3NDM0NTY3O2k9MTAuMC4wLjE7
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '400':
          description: Пустые поля или неверные учетные данные (#17149 п. 2.3, 2.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginError'
              examples:
                login_empty:
                  value:
                    code: AUTH_VALIDATION_ERROR
                    message: Введите имя пользователя или email
                    field: login
                    captcha_required: false
                wrong_username_or_password:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: Неверные имя пользователя или пароль
                    field: null
                    captcha_required: false
                wrong_email_or_password_captcha_next:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: Неверные email или пароль
                    field: null
                    captcha_required: true
        '403':
          description: Нужна CAPTCHA, email не подтвержден или учетная запись заблокирована.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginError'
              examples:
                captcha_required:
                  value:
                    code: AUTH_CAPTCHA_REQUIRED
                    message: Подтвердите, что вы не робот
                    field: captcha_token
                    captcha_required: true
                captcha_invalid:
                  value:
                    code: AUTH_CAPTCHA_INVALID
                    message: Проверка не пройдена. Попробуйте ещё раз
                    field: captcha_token
                    captcha_required: true
                email_not_confirmed:
                  value:
                    code: AUTH_EMAIL_NOT_CONFIRMED
                    message: Email не подтверждён. Проверьте почту или запросите новую ссылку
                    field: null
                    captcha_required: false
                account_blocked:
                  value:
                    code: AUTH_ACCOUNT_BLOCKED
                    message: Ваша учётная запись заблокирована. Обратитесь в службу поддержки
                    field: null
                    captcha_required: false
        '429':
          description: |
            `AUTH_LOGIN_LOCKED` - вход заблокирован после 5 неудачных попыток подряд
            (#17149 п. 2.4, 2.5). `{N}` - сколько минут осталось, с округлением вверх,
            `Retry-After` - то же в секундах, не больше 900. С тем же HTTP-кодом приходит общий
            лимит запросов nginx (`TooManyRequests`, `RATE_LIMITED`), клиент различает их по `code`.
          headers:
            Retry-After:
              description: Через сколько секунд можно повторить вход.
              schema:
                type: integer
              example: 840
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTH_LOGIN_LOCKED
                message: Слишком много попыток входа. Повторите через 14 минут
                field: null
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выход
      description: |
        Завершает текущую сессию (#17151): запись удаляется, cookie стирается. Клиент уходит на
        главную как гость. Другие сессии пользователя остаются: выход со всех устройств
        требованиями не задан (вопрос в комментарии к #17151).

        401 (сессия уже истекла) клиент считает успешным выходом: окно входа не открывает.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Сессия завершена.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionClearCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Текущая сессия и пользователь
      description: |
        Клиент вызывает при загрузке SPA, чтобы понять, гость он или авторизован: cookie
        `HttpOnly`, из JavaScript ее не видно. По ответу шапка показывает аватар или кнопки
        «Войти» и «Зарегистрироваться» (#17149 п. 2.6, #17151 п. 1 шаг 5). В требованиях такой
        операции нет, она нужна из-за `HttpOnly` (допущение).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Пользователь авторизован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
              example:
                user:
                  username: movie_fan_42
                  avatar_url: null
                  has_password: true
                expires_at: '2026-09-28T12:00:00Z'
        '401':
          description: |
            Гость или сессия недействительна (#17094 п. 1.1, 1.3). Такой же ответ у любой
            операции с `sessionCookie` (общий ответ `Unauthorized`), правила - в теге Auth.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionClearCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_required:
                  value:
                    code: SESSION_REQUIRED
                    message: Войдите, чтобы продолжить
                    field: null
                session_expired:
                  value:
                    code: SESSION_EXPIRED
                    message: Сессия истекла. Войдите снова
                    field: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/oidc/{provider}/start:
    get:
      tags: [OIDC]
      operationId: startOidcLogin
      summary: Начало входа через OIDC-провайдера
      description: |
        Кнопка «Продолжить с Google / Яндекс / VK» (#17148 п. 3.2 шаги 3-4, #17149 п. 3.1). Это
        переход браузера, а не запрос из JavaScript. Backend создает запись со `state` и PKCE
        `code_verifier`, ставит cookie `dv_oidc` и отправляет браузер на страницу авторизации
        провайдера. Запрашиваются email и имя профиля (#17148 п. 3.2 шаг 7).
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthOidcProviderPath'
      responses:
        '302':
          description: Переход к провайдеру.
          headers:
            Location:
              description: |
                Страница авторизации провайдера с `client_id`, `redirect_uri`, `state`,
                `code_challenge` (S256).
              schema:
                type: string
              example: 'https://oauth.yandex.ru/authorize?response_type=code&client_id=...&state=...&code_challenge=...&code_challenge_method=S256'
            Set-Cookie:
              description: '`dv_oidc=<id>; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=1800`.'
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/oidc/{provider}/callback:
    get:
      tags: [OIDC]
      operationId: handleOidcCallback
      summary: Возврат от OIDC-провайдера
      description: |
        `redirect_uri`, зарегистрированный у провайдера:
        `https://<домен>/api/v1/auth/oidc/{provider}/callback`. Backend проверяет `state` по
        cookie `dv_oidc`, меняет код на токены, запрашивает профиль и ищет учетную запись
        (#17148 п. 3.2 шаги 6-7, #17149 п. 3.1 шаг 7).

        Ответ - всегда 302 на страницу SPA `/auth/oidc` с параметрами `provider` и `result`,
        JSON не возвращается, в том числе при ошибке. Значения `result` - в теге OIDC. Код и
        описание ошибки провайдера наружу не передаются (#17094 п. 4.3).
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthOidcProviderPath'
        - name: code
          in: query
          required: false
          description: Авторизационный код, если пользователь дал доступ.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Значение `state` из запроса к провайдеру. Нет или не совпало - `result=error`.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Ошибка провайдера, например `access_denied` при отказе (#17148 п. 3.4).
          schema:
            type: string
        - $ref: '#/components/parameters/AuthOidcCookie'
      responses:
        '302':
          description: Переход на страницу SPA с исходом входа.
          headers:
            Location:
              schema:
                type: string
              example: '/auth/oidc?provider=google&result=registration_required'
            Set-Cookie:
              description: |
                `success` - `dv_session` (как в `SessionCreated`), `dv_oidc` стирается;
                `registration_required`, `link_required` - `dv_oidc` продлевается на 30 минут;
                остальные исходы - `dv_oidc` стирается.
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/oidc/pending:
    get:
      tags: [OIDC]
      operationId: getOidcPending
      summary: Данные незавершенного входа через OIDC
      description: |
        Для страниц после исходов `registration_required` и `link_required`: предзаполненное имя
        пользователя (#17148 п. 3.2 шаг 8) или email для сообщения о привязке (п. 3.2 шаг 7).
        Email не передается в адресе редиректа, чтобы не попадать в историю браузера и логи.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthOidcCookie'
      responses:
        '200':
          description: Данные для страницы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOidcPending'
              examples:
                registration:
                  value:
                    kind: registration
                    provider: google
                    email: ivan@gmail.com
                    suggested_username: ivan_petrov
                link:
                  value:
                    kind: link
                    provider: vk
                    email: ivan@example.com
                    suggested_username: null
        '410':
          $ref: '#/components/responses/AuthOidcExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/oidc/complete:
    post:
      tags: [OIDC]
      operationId: completeOidcRegistration
      summary: Завершение регистрации через OIDC
      description: |
        Кнопка «Продолжить» на странице «Завершение регистрации» (#17148 п. 3.2 шаги 8-10). Имя
        пользователя и год рождения проверяются как в #17148 п. 2.3.

        Успех: учетная запись со статусом «Активна» без подтверждения email, провайдер привязан,
        год рождения сохранен, создана сессия, `dv_oidc` стирается (#17148 п. 3.2, 3.3). Клиент
        уходит на главную.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthOidcCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthOidcCompleteRequest'
            example:
              username: ivan_petrov
              birth_year: 1998
      responses:
        '201':
          $ref: '#/components/responses/SessionCreated'
        '400':
          description: Нарушены правила полей (#17148 п. 2.3, 2.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                username_chars:
                  value:
                    code: AUTH_VALIDATION_ERROR
                    message: Имя пользователя может содержать только латинские буквы, цифры и нижнее подчёркивание
                    field: username
                birth_year_invalid:
                  value:
                    code: AUTH_BIRTH_YEAR_INVALID
                    message: Введите корректный год рождения
                    field: birth_year
        '409':
          description: |
            Имя пользователя занято (#17148 п. 2.4). `AUTH_EMAIL_TAKEN` - если учетную запись с
            этим email успели зарегистрировать, пока пользователь был на странице.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                username_taken:
                  value:
                    code: AUTH_USERNAME_TAKEN
                    message: Это имя пользователя уже занято
                    field: username
                email_taken:
                  value:
                    code: AUTH_EMAIL_TAKEN
                    message: Пользователь с таким email уже существует
                    field: null
        '410':
          $ref: '#/components/responses/AuthOidcExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password-reset/request:
    post:
      tags: [Password]
      operationId: requestPasswordReset
      summary: Запрос ссылки для сброса пароля
      description: |
        #17150 п. 1. Ответ всегда 202 без тела, есть учетная запись или нет (#17150 п. 1.2
        шаг 8). Клиент показывает «Если учётная запись с таким email существует, мы отправили
        ссылку для восстановления пароля. Проверьте почту».

        Если учетная запись найдена, письмо со ссылкой ставится в очередь. Ссылка живет 1 ч,
        действует только последняя (#17150 п. 1.2 шаг 9). Письмо уходит через очередь, поэтому
        время ответа не зависит от того, найден ли email (wiki «Стек технологий», разд. 7).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasswordResetRequest'
            example:
              login: ivan@example.com
      responses:
        '202':
          description: Запрос принят.
        '400':
          description: Пустое поле или неверный формат (#17150 п. 1.2 шаг 4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTH_VALIDATION_ERROR
