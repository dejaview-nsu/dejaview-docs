name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит отменяет проверку старого
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint OpenAPI specs
        run: |
          set -euo pipefail
          mapfile -t specs < <(git ls-files '*openapi*.yaml' '*openapi*.yml')
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "::notice::OpenAPI-файлов в репозитории нет"
            exit 0
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/spec" \
            redocly/cli:2.54.3 \
            lint --format=github-actions "${specs[@]}"
